<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LWAR Arena V1.2 - Torneio Oficial</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --frenzy: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .battle-status {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .timer-box {
            background: #090d16;
            border: 2px solid var(--panel-border);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .timer-box.frenzy {
            border-color: var(--frenzy);
            color: var(--frenzy);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        main {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            max-height: calc(100vh - 80px);
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: rgba(0,0,0,0.2);
            padding: 0.75rem 1rem;
            font-weight: bold;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Ranking & Listas */
        .ranking-list, .waiting-list, .tournament-bracket {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ranking-item {
            background: rgba(255,255,255,0.03);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border-left: 4px solid var(--panel-border);
        }

        .ranking-item.top-tier {
            border-left-color: var(--primary);
        }

        .ranking-item.waiting {
            opacity: 0.6;
            border-left-color: var(--text-muted);
        }

        .ranking-item.champion-badge {
            border-left-color: var(--warning);
            background: rgba(234, 179, 8, 0.1);
        }

        /* Arena Central */
        .arena-container {
            position: relative;
            background: radial-gradient(circle, #1a233a 0%, #0b1120 100%);
            border: 2px dashed var(--panel-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .arena-grid {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 1.5rem;
            gap: 1rem;
            overflow-y: auto;
        }

        /* Arena de Batalha do Torneio (1v1) */
        .tournament-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
            gap: 1.5rem;
        }

        .vs-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
            max-width: 700px;
        }

        .fighter-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 1rem;
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .fighter-card.attacking {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .fighter-card.eliminated {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        .fighter-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .fighter-class {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .hp-bar-container {
            background: #090d16;
            border-radius: 4px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hp-bar-fill {
            background: var(--success);
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        .fighter-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .vs-badge {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }

        .transition-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
            padding: 2rem;
        }

        .transition-screen h2 {
            font-size: 2rem;
            color: var(--warning);
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }

        /* Simulador e Controles */
        .sim-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input, select {
            background: #090d16;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.danger {
            background: var(--accent);
            color: white;
        }

        button.warning {
            background: var(--warning);
            color: #0f172a;
        }

        .gift-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .gift-btn {
            background: #334155;
            color: white;
            font-size: 0.8rem;
            padding: 0.4rem;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fighter-card {
            animation: slideIn 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚔️ LWAR ARENA V1.2</div>
        <div class="battle-status">
            <div>Fase: <span id="phaseStatusText" style="color: var(--primary);">Disputa Top 20</span></div>
            <div class="timer-box" id="mainTimer">01:00</div>
        </div>
        <div>
            <button id="skipRankingBtn" class="warning">Forçar Início Torneio</button>
        </div>
    </header>

    <main>
        <!-- Painel Esquerdo: Ranking Top 20 ou Status do Torneio -->
        <div class="panel">
            <div class="panel-header" id="leftPanelHeader">
                <span>🏆 TOP 20 NA ARENA</span>
                <span id="topCount" style="font-size: 0.8rem; color: var(--primary);">0/20</span>
            </div>
            <div class="panel-body" id="leftPanelBody">
                <ul class="ranking-list" id="top20List">
                    <!-- Preenchido via JS -->
                </ul>
                <div id="waitingSection">
                    <h4 style="margin: 1rem 0 0.5rem 0; font-size: 0.85rem; color: var(--text-muted);">Aguardando na Fila (21+)</h4>
                    <ul class="waiting-list" id="waitingList">
                        <!-- Preenchido via JS -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Painel Central: Arena Visual / Torneio -->
        <div class="arena-container" id="arenaContainer">
            <div style="position: absolute; top: 10px; left: 15px; font-size: 0.8rem; color: var(--text-muted); z-index: 10;" id="arenaSubheader">
                Visualização da Arena (Top 20 Ativos)
            </div>
            <div class="arena-grid" id="arenaGrid">
                <!-- Personagens do Top 20 renderizados aqui -->
            </div>
        </div>

        <!-- Painel Direito: Simulador de Eventos / Suporte ao Torneio -->
        <div class="panel">
            <div class="panel-header">
                <span id="simPanelTitle">🧪 Simulador de Eventos</span>
            </div>
            <div class="panel-body" id="simPanelBody">
                <div class="sim-controls" id="rankingSimControls">
                    <div class="form-group">
                        <label>Adicionar Jogador de Teste</label>
                        <input type="text" id="newUsername" placeholder="@username">
                    </div>
                    <div class="form-group">
                        <label>Classe</label>
                        <select id="newClass">
                            <option value="Guerreiro">Guerreiro</option>
                            <option value="Assassino">Assassino</option>
                            <option value="Mago">Mago</option>
                            <option value="Tanque">Tanque</option>
                            <option value="Ninja">Ninja</option>
                        </select>
                    </div>
                    <button id="addPlayerBtn">Criar / Entrar Jogador</button>

                    <hr style="border-color: var(--panel-border); margin: 0.5rem 0;">

                    <div class="form-group">
                        <label>Simular Presente para Jogador (Ranking)</label>
                        <select id="targetPlayerSelect">
                            <option value="">Selecione o jogador...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Escolher Presente / Pontos</label>
                        <div class="gift-buttons">
                            <button class="gift-btn" onclick="simGiftRanking(10)">+10 pts</button>
                            <button class="gift-btn" onclick="simGiftRanking(50)">+50 pts</button>
                            <button class="gift-btn" onclick="simGiftRanking(100)">+100 pts</button>
                            <button class="gift-btn" onclick="simGiftRanking(500)">+500 pts</button>
                            <button class="gift-btn" onclick="simGiftRanking(1000)">+1000 pts</button>
                        </div>
                    </div>

                    <hr style="border-color: var(--panel-border); margin: 0.5rem 0;">

                    <div class="form-group">
                        <label>Ações Rápidas</label>
                        <button onclick="Game.initDemoPlayers(25)" style="background: #334155; color: white;">Popular com 25 Jogadores</button>
                    </div>
                </div>

                <!-- Controles de Suporte durante o Torneio -->
                <div class="sim-controls" id="tournamentSimControls" style="display: none;">
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">Apoie os lutadores ativos na batalha atual:</p>
                    <div id="tournamentGiftButtonsContainer">
                        <!-- Preenchido dinamicamente para Fighter A e Fighter B -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * LWAR ARENA - ARQUITETURA V1.2 (TORNEIO OFICIAL)
         */
        const DEBUG = true;

        const CONFIG = {
            MAX_ARENA_PLAYERS: 20,
            RANKING_PHASE_DURATION: 60, // 60 segundos para fase de ranking
            BATTLE_DURATION: 60,
            FRENZY_TRIGGER_TIME: 10,
            FRENZY_DAMAGE_MULT: 2.0,
            FRENZY_SPEED_MULT: 1.5
        };

        // Estado Global Centralizado
        const gameState = {
            players: [],
            arenaPlayers: [],
            waitingPlayers: [],
            phase: 'RANKING', // 'RANKING' | 'TRANSITION' | 'TOURNAMENT' | 'CHAMPION'
            rankingTimer: CONFIG.RANKING_PHASE_DURATION,
            rankingInterval: null
        };

        // Estado do Torneio V1.2
        const tournamentState = {
            active: false,
            players: [],          // Cópia congelada do Top 20 ordenado (0 = 1º, 19 = 20º)
            currentIndex: 19,     // Aponta para o desafiante atual (começa no 20º, índice 19)
            fighterA: null,       // Lutador A (ex: 20º)
            fighterB: null,       // Lutador B (ex: 19º)
            currentWinner: null,  // Vencedor da última partida
            champion: null,       // Grande campeão
            battleTimer: CONFIG.BATTLE_DURATION,
            frenzy: false,
            battleInterval: null
        };

        // ClassManager: Definição de Classes e Atributos Base
        const ClassManager = {
            classes: {
                Guerreiro: { hp: 120, strength: 25, defense: 15, speed: 10 },
                Assassino: { hp: 90,  strength: 35, defense: 8,  speed: 25 },
                Mago:      { hp: 80,  strength: 40, defense: 5,  speed: 15 },
                Tanque:    { hp: 160, strength: 15, defense: 25, speed: 5  },
                Ninja:     { hp: 100, strength: 30, defense: 10, speed: 30 }
            },
            getStats(className) {
                return this.classes[className] || this.classes.Guerreiro;
            }
        };

        // RankManager: Sistema de Progressão por Pontos
        const RankManager = {
            getRank(points) {
                if (points >= 5000) return "Deus";
                if (points >= 3000) return "Anjo";
                if (points >= 1800) return "Demônio";
                if (points >= 1000) return "Mestre";
                if (points >= 500)  return "Avançado";
                return "Iniciante";
            }
        };

        // GiftService: Camada preparada para TikTok LIVE ou Simulação
        const GiftService = {
            mode: "SIMULATION",
            onGiftReceived(callback) {
                this.listener = callback;
            },
            simulate(username, coins) {
                if (DEBUG) console.log(`[Gift] @${username} recebeu ${coins} moedas/pontos.`);
                if (this.listener) {
                    this.listener({ username, coins });
                }
            }
        };

        // RankingManager
        const RankingManager = {
            addOrUpdatePlayer(username, charClass, pointsDelta) {
                // Durante o torneio, o ranking do Top 20 inicial é estritamente congelado.
                if (gameState.phase !== 'RANKING') {
                    if (DEBUG) console.log(`[Ranking] Tentativa de pontuação para @${username} ignorada: Fase de Ranking encerrada.`);
                    return;
                }

                let player = gameState.players.find(p => p.username === username);
                if (!player) {
                    const baseStats = ClassManager.getStats(charClass);
                    player = {
                        id: 'p_' + Math.random().toString(36).substr(2, 9),
                        username: username.startsWith('@') ? username : '@' + username,
                        charClass: charClass,
                        points: 0,
                        hp: baseStats.hp,
                        maxHp: baseStats.hp,
                        strength: baseStats.strength,
                        defense: baseStats.defense,
                        speed: baseStats.speed,
                        status: 'aguardando',
                        lastPointTimestamp: Date.now()
                    };
                    gameState.players.push(player);
                }

                if (pointsDelta) {
                    player.points += pointsDelta;
                    player.lastPointTimestamp = Date.now();
                }

                player.rank = RankManager.getRank(player.points);
                this.recalculateRanking();
            },

            recalculateRanking() {
                if (gameState.phase !== 'RANKING') return;

                gameState.players.sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    return a.lastPointTimestamp - b.lastPointTimestamp;
                });

                gameState.players.forEach((p, idx) => {
                    p.position = idx + 1;
                });

                gameState.arenaPlayers = gameState.players.slice(0, CONFIG.MAX_ARENA_PLAYERS);
                gameState.waitingPlayers = gameState.players.slice(CONFIG.MAX_ARENA_PLAYERS);

                gameState.arenaPlayers.forEach(p => {
                    p.status = 'ativo';
                    if (p.hp <= 0) p.hp = p.maxHp;
                });

                gameState.waitingPlayers.forEach(p => {
                    p.status = 'aguardando';
                });

                UI.renderRankingPhase();
            }
        };

        // TournamentManager: Gerenciamento do fluxo de torneio, rodadas e confrontos
        const TournamentManager = {
            initTournament() {
                if (gameState.phase === 'TOURNAMENT' || gameState.phase === 'CHAMPION') return;

                // 1. Congelar Top 20
                gameState.phase = 'TRANSITION';
                if (gameState.rankingInterval) clearInterval(gameState.rankingInterval);

                // Garantir ordenação correta do Top 20 (1º ao 20º)
                gameState.arenaPlayers.sort((a, b) => a.position - b.position);
                tournamentState.players = [...gameState.arenaPlayers];

                if (tournamentState.players.length < 2) {
                    alert("Jogadores insuficientes para iniciar o torneio! Adicione pelo menos 2 jogadores.");
                    gameState.phase = 'RANKING';
                    Game.startRankingTimer();
                    return;
                }

                if (DEBUG) console.log("[Tournament] Top 20 congelado. Iniciando transição para o torneio.");

                UI.renderTransitionScreen(() => {
                    gameState.phase = 'TOURNAMENT';
                    tournamentState.active = true;
                    // Começar no final da lista: 20º (índice 19) vs 19º (índice 18)
                    tournamentState.currentIndex = tournamentState.players.length - 1; 
                    this.startFirstMatch();
                });
            },

            startFirstMatch() {
                const len = tournamentState.players.length;
                // 20º vs 19º (índices len - 1 e len - 2)
                tournamentState.fighterA = tournamentState.players[len - 1];
                tournamentState.fighterB = tournamentState.players[len - 2];
                tournamentState.currentIndex = len - 3; // Próximo desafiante será o 18º (índice len - 3)

                this.setupMatch();
            },

            startNextMatch(winner) {
                tournamentState.currentWinner = winner;

                if (tournamentState.currentIndex < 0) {
                    // O vencedor atual enfrentará o 1º colocado (índice 0) na GRANDE FINAL!
                    const firstPlace = tournamentState.players[0];
                    if (winner.username === firstPlace.username) {
                        // Se por acaso o vencedor for o próprio 1º (caso raro em simulações), já é campeão
                        this.declareChampion(winner);
                        return;
                    }

                    tournamentState.fighterA = winner;
                    tournamentState.fighterB = firstPlace;
                    tournamentState.currentIndex = -99; // Marcador de que esta é a final contra o 1º
                    this.setupMatch();
                    return;
                }

                if (tournamentState.currentIndex === -99) {
                    // A final contra o 1º acabou! O vencedor é o CAMPEÃO DA LWAR!
                    this.declareChampion(winner);
                    return;
                }

                // Confronto normal: Vencedor anterior vs Próximo jogador do ranking (subindo em direção ao topo)
                tournamentState.fighterA = winner;
                tournamentState.fighterB = tournamentState.players[tournamentState.currentIndex];
                tournamentState.currentIndex--; // Avança para o próximo jogador superior na próxima rodada

                this.setupMatch();
            },

            setupMatch() {
                // Restaurar HP total para o combate
                tournamentState.fighterA.hp = tournamentState.fighterA.maxHp;
                tournamentState.fighterB.hp = tournamentState.fighterB.maxHp;
                tournamentState.fighterA.status = 'ativo';
                tournamentState.fighterB.status = 'ativo';

                tournamentState.battleTimer = CONFIG.BATTLE_DURATION;
                tournamentState.frenzy = false;

                BattleManager.startBattleTimer();
                UI.renderTournamentBattle();
            },

            declareChampion(champion) {
                gameState.phase = 'CHAMPION';
                tournamentState.active = false;
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                tournamentState.champion = champion;

                if (DEBUG) console.log(`[Tournament] 🏆 CAMPEÃO DA LWAR: ${champion.username}`);
                UI.renderChampionScreen(champion);
            }
        };

        // BattleManager: Batalha individual de 60s com Frenesi
        const BattleManager = {
            startBattleTimer() {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);

                tournamentState.battleInterval = setInterval(() => {
                    if (gameState.phase !== 'TOURNAMENT') return;

                    tournamentState.battleTimer--;

                    if (tournamentState.battleTimer <= CONFIG.FRENZY_TRIGGER_TIME && !tournamentState.frenzy) {
                        tournamentState.frenzy = true;
                        if (DEBUG) console.log("[Battle] FRENESI ATIVADO NO TORNEIO!");
                    }

                    if (tournamentState.battleTimer <= 0) {
                        this.resolveBattleByTimeout();
                    }

                    UI.updateTournamentTimer();
                    this.tickCombat();
                }, 1000);
            },

            tickCombat() {
                if (!tournamentState.fighterA || !tournamentState.fighterB) return;
                if (tournamentState.fighterA.hp <= 0 || tournamentState.fighterB.hp <= 0) return;

                // Combate automático entre Fighter A e Fighter B
                const attacker = Math.random() < 0.5 ? tournamentState.fighterA : tournamentState.fighterB;
                const defender = attacker === tournamentState.fighterA ? tournamentState.fighterB : tournamentState.fighterA;

                const frenzyMult = tournamentState.frenzy ? CONFIG.FRENZY_DAMAGE_MULT : 1.0;
                const rawDamage = Math.max(8, Math.floor((attacker.strength * 1.3 - defender.defense * 0.4) * frenzyMult));

                defender.hp = Math.max(0, defender.hp - rawDamage);

                if (DEBUG) console.log(`[Battle] ${attacker.username} atingiu ${defender.username} por ${rawDamage} dmg. HP Restante: ${defender.hp}`);

                UI.flashFighter(attacker.id);
                UI.renderTournamentBattle();

                if (defender.hp <= 0) {
                    this.endBattle(attacker, defender);
                }
            },

            resolveBattleByTimeout() {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);

                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;

                let winner, loser;
                if (fA.hp > fB.hp) {
                    winner = fA;
                    loser = fB;
                } else if (fB.hp > fA.hp) {
                    winner = fB;
                    loser = fA;
                } else {
                    // Desempate determinístico por maior força ou pontos iniciais
                    winner = fA.strength >= fB.strength ? fA : fB;
                    loser = winner === fA ? fB : fA;
                }

                if (DEBUG) console.log(`[Battle] Fim do tempo! Vencedor por HP: ${winner.username}`);
                this.endBattle(winner, loser);
            },

            endBattle(winner, loser) {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                loser.status = 'eliminado';
                winner.status = 'ativo';

                if (DEBUG) console.log(`[Battle] Vencedor do confronto: ${winner.username}. Perdedor eliminado: ${loser.username}`);

                UI.renderMatchResult(winner, loser, () => {
                    TournamentManager.startNextMatch(winner);
                });
            }
        };

        // UI Manager & Renderização
        const UI = {
            renderAll() {
                if (gameState.phase === 'RANKING') {
                    this.renderRankingPhase();
                }
            },

            renderRankingPhase() {
                document.getElementById('phaseStatusText').innerText = "Disputa Top 20";
                document.getElementById('skipRankingBtn').style.display = "block";
                document.getElementById('rankingSimControls').style.display = "flex";
                document.getElementById('tournamentSimControls').style.display = "none";
                document.getElementById('simPanelTitle').innerText = "🧪 Simulador de Eventos (TikTok)";
                document.getElementById('leftPanelHeader').innerHTML = '<span>🏆 TOP 20 NA ARENA</span><span id="topCount" style="font-size: 0.8rem; color: var(--primary);">' + gameState.arenaPlayers.length + '/20</span>';
                document.getElementById('waitingSection').style.display = "block";
                document.getElementById('arenaSubheader').innerText = "Visualização da Arena (Top 20 Ativos)";

                const topList = document.getElementById('top20List');
                const waitingList = document.getElementById('waitingList');

                topList.innerHTML = '';
                waitingList.innerHTML = '';

                gameState.arenaPlayers.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'ranking-item top-tier';
                    li.innerHTML = `<span>#${p.position} ${p.username} <small>(${p.rank})</small></span> <strong>${p.points} pts</strong>`;
                    topList.appendChild(li);
                });

                gameState.waitingPlayers.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'ranking-item waiting';
                    li.innerHTML = `<span>#${p.position} ${p.username} <small>(${p.rank})</small></span> <strong>${p.points} pts</strong>`;
                    waitingList.appendChild(li);
                });

                // Renderizar grid da arena
                const grid = document.getElementById('arenaGrid');
                grid.innerHTML = '';
                gameState.arenaPlayers.forEach(p => {
                    const card = document.createElement('div');
                    card.className = `fighter-card`;
                    const hpPercent = Math.max(0, (p.hp / p.maxHp) * 100);
                    card.innerHTML = `
                        <div class="fighter-header">
                            <span>#${p.position} ${p.username}</span>
                            <span style="color: var(--primary);">${p.points}p</span>
                        </div>
                        <div class="fighter-class">${p.charClass} • ${p.rank}</div>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill" style="width: ${hpPercent}%;"></div>
                        </div>
                        <div class="fighter-stats">
                            <span>HP: ${p.hp}/${p.maxHp}</span>
                            <span>ATK: ${p.strength}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                this.populateTargetSelect();
            },

            renderTransitionScreen(callback) {
                document.getElementById('phaseStatusText').innerText = "Torneio Iniciando";
                document.getElementById('skipRankingBtn').style.display = "none";
                const container = document.getElementById('arenaContainer');
                container.innerHTML = `
                    <div class="transition-screen">
                        <h2>🔥 TOP 20 DEFINIDO! 🔥</h2>
                        <p style="font-size: 1.2rem; color: var(--text-main);">O RANKING ESTÁ CONGELADO.</p>
                        <p style="font-size: 1.5rem; font-weight: bold; color: var(--primary);">O TORNEIO VAI COMEÇAR! ⚔️</p>
                    </div>
                `;
                setTimeout(callback, 2500);
            },

            renderTournamentBattle() {
                document.getElementById('phaseStatusText').innerText = tournamentState.currentIndex === -99 ? "⚔️ GRANDE FINAL (VS 1º)" : "⚔️ TORNEIO LWAR";
                document.getElementById('skipRankingBtn').style.display = "none";
                document.getElementById('rankingSimControls').style.display = "none";
                document.getElementById('tournamentSimControls').style.display = "flex";
                document.getElementById('simPanelTitle').innerText = "🎁 Apoio na Batalha (Presentes)";

                // Atualizar painel esquerdo com bracket/jogadores do torneio
                document.getElementById('leftPanelHeader').innerHTML = '<span>🛡️ TOP 20 (CONGELADO)</span>';
                document.getElementById('waitingSection').style.display = "none";
                const topList = document.getElementById('top20List');
                topList.innerHTML = '';
                tournamentState.players.forEach(p => {
                    const li = document.createElement('li');
                    const isFighter = (tournamentState.fighterA && p.username === tournamentState.fighterA.username) || (tournamentState.fighterB && p.username === tournamentState.fighterB.username);
                    const isEliminated = p.status === 'eliminado';
                    li.className = `ranking-item ${isFighter ? 'top-tier' : ''} ${isEliminated ? 'waiting' : ''}`;
                    li.innerHTML = `<span>#${p.position} ${p.username} ${isFighter ? '⚔️' : ''}</span> <strong>${isEliminated ? 'ELIMINADO' : p.rank}</strong>`;
                    topList.appendChild(li);
                });

                // Renderizar Arena 1v1
                document.getElementById('arenaSubheader').innerText = tournamentState.currentIndex === -99 ? "GRANDE FINAL: VENCEDOR VS 1º LUGAR" : "CONFRONTO DO TORNEIO";
                const container = document.getElementById('arenaContainer');

                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;
                const hpAPercent = Math.max(0, (fA.hp / fA.maxHp) * 100);
                const hpBPercent = Math.max(0, (fB.hp / fB.maxHp) * 100);

                container.innerHTML = `
                    <div style="position: absolute; top: 10px; left: 15px; font-size: 0.8rem; color: var(--text-muted); z-index: 10;">
                        ${tournamentState.currentIndex === -99 ? "GRANDE FINAL" : "Confronto de Eliminatórias"}
                    </div>
                    <div class="tournament-arena">
                        <div class="vs-container">
                            <!-- Fighter A -->
                            <div class="fighter-card" id="fighter_${fA.id}">
                                <div class="fighter-header">
                                    <span>#${fA.position} ${fA.username}</span>
                                    <span style="color: var(--primary);">${fA.points}p</span>
                                </div>
                                <div class="fighter-class">${fA.charClass} • ${fA.rank}</div>
                                <div class="hp-bar-container">
                                    <div class="hp-bar-fill" style="width: ${hpAPercent}%;"></div>
                                </div>
                                <div class="fighter-stats">
                                    <span>HP: ${fA.hp}/${fA.maxHp}</span>
                                    <span>ATK: ${fA.strength}</span>
                                </div>
                            </div>

                            <div class="vs-badge">VS</div>

                            <!-- Fighter B -->
                            <div class="fighter-card" id="fighter_${fB.id}">
                                <div class="fighter-header">
                                    <span>#${fB.position} ${fB.username}</span>
                                    <span style="color: var(--primary);">${fB.points}p</span>
                                </div>
                                <div class="fighter-class">${fB.charClass} • ${fB.rank}</div>
                                <div class="hp-bar-container">
                                    <div class="hp-bar-fill" style="width: ${hpBPercent}%;"></div>
                                </div>
                                <div class="fighter-stats">
                                    <span>HP: ${fB.hp}/${fB.maxHp}</span>
                                    <span>ATK: ${fB.strength}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Renderizar botões de presente para os lutadores atuais
                const giftButtonsContainer = document.getElementById('tournamentGiftButtonsContainer');
                giftButtonsContainer.innerHTML = `
                    <div style="margin-bottom: 0.75rem;">
                        <strong style="color: var(--primary); font-size: 0.85rem;">🎁 Apoiar ${fA.username}</strong>
                        <div class="gift-buttons">
                            <button class="gift-btn" onclick="simGiftTournament('${fA.username}', 10)">+10</button>
                            <button class="gift-btn" onclick="simGiftTournament('${fA.username}', 50)">+50</button>
                            <button class="gift-btn" onclick="simGiftTournament('${fA.username}', 100)">+100</button>
                        </div>
                    </div>
                    <div>
                        <strong style="color: var(--accent); font-size: 0.85rem;">🎁 Apoiar ${fB.username}</strong>
                        <div class="gift-buttons">
                            <button class="gift-btn" onclick="simGiftTournament('${fB.username}', 10)">+10</button>
                            <button class="gift-btn" onclick="simGiftTournament('${fB.username}', 50)">+50</button>
                            <button class="gift-btn" onclick="simGiftTournament('${fB.username}', 100)">+100</button>
                        </div>
                    </div>
                    <div style="margin-top: 1rem;">
                        <button onclick="simGiftTournament('${fA.username}', 500)" style="background: #334155; color: white; width: 100%; font-size: 0.75rem;">Auto-Apoio (${fA.username} +500)</button>
                    </div>
                `;

                this.updateTournamentTimer();
            },

            renderMatchResult(winner, loser, callback) {
                const container = document.getElementById('arenaContainer');
                container.innerHTML = `
                    <div class="transition-screen">
                        <h2 style="color: var(--success);">⚔️ FIM DO CONFRONTO! ⚔️</h2>
                        <p style="font-size: 1.3rem;">Vencedor: <strong style="color: var(--primary);">${winner.username}</strong></p>
                        <p style="font-size: 1rem; color: var(--text-muted);">${loser.username} foi eliminado do torneio.</p>
                    </div>
                `;
                setTimeout(callback, 2500);
            },

            renderChampionScreen(champion) {
                document.getElementById('phaseStatusText').innerText = "🏆 CAMPEÃO DEFINIDO";
                const container = document.getElementById('arenaContainer');
                container.innerHTML = `
                    <div class="transition-screen">
                        <h2 style="font-size: 2.5rem; color: var(--warning);">🏆 CAMPEÃO DA LWAR 🏆</h2>
                        <p style="font-size: 1.8rem; font-weight: bold; color: var(--primary);">${champion.username}</p>
                        <p style="font-size: 1.1rem; color: var(--text-muted);">Classe: ${champion.charClass} | Rank Original: ${champion.rank}</p>
                        <button onclick="location.reload()" style="margin-top: 1.5rem; background: var(--warning); color: #0f172a; padding: 0.75rem 1.5rem; font-size: 1rem;">Reiniciar Nova Temporada</button>
                    </div>
                `;

                // Atualizar painel esquerdo com o campeão em destaque
                const topList = document.getElementById('top20List');
                topList.innerHTML = `<li class="ranking-item champion-badge"><span>🏆 CAMPEÃO: ${champion.username}</span> <strong>TOP 1</strong></li>` + topList.innerHTML;
            },

            updateTournamentTimer() {
                const timerBox = document.getElementById('mainTimer');
                const minutes = String(Math.floor(tournamentState.battleTimer / 60)).padStart(2, '0');
                const seconds = String(tournamentState.battleTimer % 60).padStart(2, '0');
                timerBox.innerText = `${minutes}:${seconds}`;

                if (tournamentState.frenzy) {
                    timerBox.classList.add('frenzy');
                } else {
                    timerBox.classList.remove('frenzy');
                }
            },

            updateRankingTimerDisplay() {
                const timerBox = document.getElementById('mainTimer');
                const minutes = String(Math.floor(gameState.rankingTimer / 60)).padStart(2, '0');
                const seconds = String(gameState.rankingTimer % 60).padStart(2, '0');
                timerBox.innerText = `${minutes}:${seconds}`;
                timerBox.classList.remove('frenzy');
            },

            populateTargetSelect() {
                const select = document.getElementById('targetPlayerSelect');
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '<option value="">Selecione o jogador...</option>';
                
                gameState.players.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.username;
                    opt.innerText = `${p.username} (${p.points} pts)`;
                    select.appendChild(opt);
                });
                select.value = currentVal;
            },

            flashFighter(id) {
                const card = document.getElementById(`fighter_${id}`);
                if (card) {
                    card.classList.add('attacking');
                    setTimeout(() => card.classList.remove('attacking'), 300);
                }
            }
        };

        // Game Controller & Timer de Ranking
        const Game = {
            initDemoPlayers(count = 25) {
                const classes = Object.keys(ClassManager.classes);
                const sampleNames = ["GamerBR", "Shadow", "Loxia", "Titan", "ZeldaFan", "NarutoX", "Kratos", "Valkyrie", "Phoenix", "Blaze", "Storm", "Frost", "Cyber", "NinjaBro", "MageKing", "Apex", "Vortex", "Matrix", "Ghost", "Specter", "Ronin", "Samurai", "Paladin", "Druid", "Bard"];
                
                for (let i = 0; i < count; i++) {
                    const name = sampleNames[i % sampleNames.length] + (i >= sampleNames.length ? i : '');
                    const cClass = classes[Math.floor(Math.random() * classes.length)];
                    const initialPoints = Math.floor(Math.random() * 900) + 100;
                    RankingManager.addOrUpdatePlayer(name, cClass, initialPoints);
                }
            },

            startRankingTimer() {
                if (gameState.rankingInterval) clearInterval(gameState.rankingInterval);

                gameState.rankingInterval = setInterval(() => {
                    if (gameState.phase !== 'RANKING') return;

                    gameState.rankingTimer--;
                    UI.updateRankingTimerDisplay();

                    if (gameState.rankingTimer <= 0) {
                        clearInterval(gameState.rankingInterval);
                        TournamentManager.initTournament();
                    }
                }, 1000);
            }
        };

        // Event Listeners e Controles da Interface
        document.getElementById('addPlayerBtn').addEventListener('click', () => {
            if (gameState.phase !== 'RANKING') {
                alert("A fase de ranking foi encerrada. Não é possível adicionar novos jogadores durante o torneio.");
                return;
            }
            const input = document.getElementById('newUsername');
            const classSelect = document.getElementById('newClass');
            const username = input.value.trim();
            if (!username) return alert("Digite um nome de usuário válido!");

            RankingManager.addOrUpdatePlayer(username, classSelect.value, 150);
            input.value = '';
        });

        document.getElementById('skipRankingBtn').addEventListener('click', () => {
            if (gameState.phase === 'RANKING') {
                TournamentManager.initTournament();
            }
        });

        function simGiftRanking(coins) {
            const select = document.getElementById('targetPlayerSelect');
            const username = select.value;
            if (!username) {
                alert("Selecione um jogador para enviar o presente!");
                return;
            }
            GiftService.simulate(username, coins);
        }

        function simGiftTournament(username, coins) {
            GiftService.simulate(username, coins);
        }

        // Conectar GiftService
        GiftService.onGiftReceived(event => {
            if (gameState.phase === 'RANKING') {
                const existing = gameState.players.find(p => p.username === event.username);
                const charClass = existing ? existing.charClass : "Guerreiro";
                RankingManager.addOrUpdatePlayer(event.username, charClass, event.coins);
            } else if (gameState.phase === 'TOURNAMENT') {
                // Durante o torneio, presentes aplicam efeito imediato de poder/HP/força ou bônus no lutador ativo correspondente
                let targetFighter = null;
                if (tournamentState.fighterA && tournamentState.fighterA.username === event.username) {
                    targetFighter = tournamentState.fighterA;
                } else if (tournamentState.fighterB && tournamentState.fighterB.username === event.username) {
                    targetFighter = tournamentState.fighterB;
                }

                if (targetFighter) {
                    targetFighter.strength += Math.floor(event.coins / 20); // Bônus temporário de força baseado no presente
                    targetFighter.hp = Math.min(targetFighter.maxHp, targetFighter.hp + Math.floor(event.coins / 10)); // Bônus de cura
                    if (DEBUG) console.log(`[Gift Tournament] @${event.username} apoiado! Força aumentada para ${targetFighter.strength}, HP recuperado para ${targetFighter.hp}`);
                    UI.renderTournamentBattle();
                } else {
                    if (DEBUG) console.log(`[Gift Tournament] @${event.username} não está lutando na partida atual.`);
                }
            }
        });

        // Inicialização
        window.addEventListener('DOMContentLoaded', () => {
            Game.initDemoPlayers(25); // Cria 25 jogadores para teste (20 na arena, 5 na espera)
            UI.updateRankingTimerDisplay();
            Game.startRankingTimer();
        });
    </script>
</body>
</html>
