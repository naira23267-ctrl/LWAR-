<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LWAR ARENA V1.4 — Arena + Stickman Combat Prototype</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-obsidian: #080b13;
            --panel-stone: #111827;
            --panel-border: #1f293d;
            --panel-border-gold: #c5a059;
            --gold: #f3d179;
            --gold-dark: #b8860b;
            --accent-red: #991b1b;
            --accent-red-bright: #ef4444;
            --hp-green: #15803d;
            --hp-green-bright: #22c55e;
            --magic-cyan: #0ea5e9;
            --rare-purple: #9333ea;
            --frenzy-orange: #ea580c;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cinzel', 'Georgia', serif, sans-serif;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 15%, #18223c 0%, #080b13 100%);
            max-width: 100vw;
        }

        header {
            background-color: var(--panel-stone);
            border-bottom: 3px solid var(--panel-border-gold);
            padding: 0.6rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(243, 209, 121, 0.4);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .battle-status {
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .phase-indicator {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-box {
            background: #030508;
            border: 2px solid var(--panel-border-gold);
            padding: 0.3rem 1rem;
            border-radius: 4px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
            color: var(--gold);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
        }

        .timer-box.frenzy {
            border-color: var(--frenzy-orange);
            color: var(--frenzy-orange);
            animation: frenzyPulse 0.6s infinite alternate;
        }

        @keyframes frenzyPulse {
            from { transform: scale(1); box-shadow: 0 0 5px var(--frenzy-orange); }
            to { transform: scale(1.04); box-shadow: 0 0 20px var(--frenzy-orange); }
        }

        /* Layout Principal Responsivo (Mobile First & Desktop Grid) */
        main {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            gap: 0.75rem;
            padding: 0.75rem;
            flex: 1;
            max-width: 100vw;
            overflow-x: hidden;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
        }

        .panel {
            background-color: var(--panel-stone);
            border: 2px solid var(--panel-border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .panel-header {
            background: linear-gradient(to bottom, #1a253a, #0b111d);
            padding: 0.6rem 0.8rem;
            font-weight: bold;
            border-bottom: 2px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .panel-body {
            padding: 0.6rem;
            overflow-y: auto;
            flex: 1;
            max-height: calc(100vh - 160px);
        }

        /* Listas de Ranking Estilo Pergaminho/Pedra */
        .ranking-list, .waiting-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .ranking-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--panel-border);
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            border-left: 4px solid var(--panel-border-gold);
            transition: all 0.2s;
        }

        .ranking-item.top-tier {
            border-left-color: var(--gold);
            background: rgba(197, 160, 89, 0.08);
        }

        .ranking-item.waiting {
            opacity: 0.5;
            border-left-color: var(--text-muted);
        }

        .ranking-item.eliminated-item {
            border-left-color: var(--accent-red-bright);
            opacity: 0.6;
            text-decoration: line-through;
        }

        /* Arena Central Dark Fantasy com Tochas e Textura */
        .arena-container {
            position: relative;
            background: radial-gradient(circle at center, #172138 0%, #070a12 100%);
            border: 3px solid var(--panel-border-gold);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 480px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.6);
        }

        /* Event Banner no Topo da Arena */
        .event-banner-container {
            width: 100%;
            height: 42px;
            background: linear-gradient(to right, transparent, rgba(15, 23, 42, 0.95), transparent);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 20;
        }

        .event-banner-text {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--gold);
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(243, 209, 121, 0.7);
            animation: slideInBanner 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        @keyframes slideInBanner {
            from { opacity: 0; transform: translateY(-12px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .arena-grid {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 0.75rem;
            gap: 0.6rem;
            overflow-y: auto;
            justify-content: center;
        }

        /* Cards de Personagem na Fase de Ranking */
        .arena-fighter-card {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 0.5rem;
            width: 120px;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .arena-fighter-card .name {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--gold);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arena-fighter-card .class {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Arena de Batalha 1v1 com Stickmans Protótipos */
        .tournament-arena-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 1rem;
            gap: 1rem;
        }

        .battle-stage-layout {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            max-width: 650px;
            position: relative;
            padding: 1rem 0;
        }

        /* Combatente Card & Stickman Wrapper */
        .fighter-combat-pod {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 220px;
            gap: 0.5rem;
            position: relative;
        }

        .fighter-battle-card {
            background: linear-gradient(135deg, #182238 0%, #0a0e1a 100%);
            border: 2px solid var(--panel-border);
            border-radius: 6px;
            padding: 0.6rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
        }

        .fighter-battle-card.eliminated {
            opacity: 0.35;
            filter: grayscale(100%);
        }

        .fighter-battle-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--gold);
        }

        .hp-bar-container {
            background: #030508;
            border-radius: 3px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            position: relative;
        }

        .hp-bar-fill {
            background: linear-gradient(to right, #16a34a, #22c55e);
            height: 100%;
            width: 100%;
            transition: width 0.35s ease;
        }

        .fighter-stats-grid {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Stickman Container & SVG Styles */
        .stickman-container {
            width: 100px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.15s ease-in-out;
        }

        .stickman-svg {
            width: 80px;
            height: 110px;
            overflow: visible;
        }

        /* Animações de Ataque e Reação do Stickman */
        .attacking-left {
            animation: attackL 0.35s ease;
        }
        @keyframes attackL {
            0% { transform: translateX(0); }
            40% { transform: translateX(35px) scale(1.05); }
            100% { transform: translateX(0); }
        }

        .attacking-right {
            animation: attackR 0.35s ease;
        }
        @keyframes attackR {
            0% { transform: translateX(0); }
            40% { transform: translateX(-35px) scale(1.05); }
            100% { transform: translateX(0); }
        }

        .taking-damage {
            animation: hitShake 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.9));
        }
        @keyframes hitShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .eliminated-stickman {
            transform: translateY(20px) rotate(-85deg);
            opacity: 0.3;
            filter: grayscale(100%);
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        /* Floating Damage Number */
        .floating-damage {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-red-bright);
            text-shadow: 0 0 6px rgba(0,0,0,0.9);
            animation: floatUpDamage 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes floatUpDamage {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            50% { transform: translate(-50%, -25px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -45px) scale(1); }
        }

        .vs-badge-epic {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-red-bright);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            animation: vsPulse 1.2s infinite alternate;
        }

        @keyframes vsPulse {
            from { transform: scale(1); text-shadow: 0 0 10px rgba(239,68,68,0.5); }
            to { transform: scale(1.08); text-shadow: 0 0 22px rgba(239,68,68,0.9); }
        }

        .transition-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
            padding: 1.5rem;
            height: 100%;
        }

        .transition-screen h2 {
            font-size: 1.8rem;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(243, 209, 121, 0.6);
            letter-spacing: 2px;
        }

        /* Modal de Presente Lendário / Épico */
        #legendaryModalOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 12, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .legendary-popup {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 1.75rem;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 35px rgba(243, 209, 121, 0.4);
            animation: popupScale 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popupScale {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Controles, Formulários e Botões Estilo RPG */
        .sim-controls {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        label {
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, select {
            background: #070a12;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        input:focus, select:focus {
            border-color: var(--gold);
            outline: none;
        }

        button {
            background: linear-gradient(to bottom, #c5a059, #9a7b38);
            color: #080b13;
            border: 1px solid var(--gold);
            padding: 0.45rem 0.8rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        button:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
        }

        button.danger {
            background: linear-gradient(to bottom, #ef4444, #991b1b);
            border-color: #ef4444;
            color: white;
        }

        button.secondary {
            background: linear-gradient(to bottom, #2a374e, #162032);
            border-color: var(--panel-border);
            color: var(--text-main);
        }

        .gift-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.3rem;
            margin-top: 0.2rem;
        }

        .gift-btn {
            background: #192338;
            color: var(--gold);
            border: 1px solid var(--panel-border);
            font-size: 0.7rem;
            padding: 0.3rem;
        }

        hr {
            border-color: var(--panel-border);
            margin: 0.35rem 0;
        }
    </style>
</head>
<body>

    <!-- Popup Especial para Presentes Lendários -->
    <div id="legendaryModalOverlay">
        <div class="legendary-popup">
            <h3 style="color: var(--gold); font-size: 1.3rem; margin-bottom: 0.4rem;" id="legendaryTitle">🎁 PRESENTE LENDÁRIO 🎁</h3>
            <p id="legendaryDesc" style="font-size: 0.95rem; margin-bottom: 1rem; color: var(--text-main);"></p>
            <button onclick="UI.closeLegendaryModal()">INCRÍVEL!</button>
        </div>
    </div>

    <header>
        <div class="logo">⚔️ LWAR ARENA <span style="font-size: 0.75rem; color: var(--text-muted);">V1.4</span></div>
        <div class="battle-status">
            <div class="phase-indicator" id="phaseStatusText">Disputa Top 20</div>
            <div class="timer-box" id="mainTimer">01:00</div>
        </div>
        <div>
            <button id="skipRankingBtn" class="secondary" style="font-size: 0.7rem;">Iniciar Torneio</button>
        </div>
    </header>

    <main>
        <!-- Painel Esquerdo: Ranking / Fila / Bracket -->
        <div class="panel">
            <div class="panel-header" id="leftPanelHeader">
                <span>🏆 TOP 20 ATIVO</span>
                <span id="topCount" style="font-size: 0.7rem; color: var(--gold);">0/20</span>
            </div>
            <div class="panel-body">
                <ul class="ranking-list" id="top20List">
                    <!-- Preenchido via JS -->
                </ul>
                <div id="waitingSection" style="margin-top: 0.75rem;">
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.3rem; text-transform: uppercase; font-weight: bold;">Fila de Espera (21+)</div>
                    <ul class="waiting-list" id="waitingList">
                        <!-- Preenchido via JS -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Painel Central: Arena Medieval / Torneio 1v1 com Stickmans -->
        <div class="arena-container" id="arenaContainer">
            <!-- Event Banner no Topo da Arena -->
            <div class="event-banner-container" id="eventBannerContainer">
                <div class="event-banner-text" id="eventBannerText">⚔️ BEM-VINDO À LWAR ARENA V1.4 ⚔️</div>
            </div>

            <div style="position: absolute; bottom: 6px; left: 10px; font-size: 0.65rem; color: var(--text-muted); z-index: 10;" id="arenaSubheader">
                Visualização da Arena (Top 20)
            </div>

            <div class="arena-grid" id="arenaGrid">
                <!-- Cards dos lutadores da arena renderizados via JS -->
            </div>
        </div>

        <!-- Painel Direito: Simulador de Eventos / Painel de Apoio -->
        <div class="panel">
            <div class="panel-header">
                <span id="simPanelTitle">🧪 Simulador de Eventos</span>
            </div>
            <div class="panel-body">
                <!-- Controles para a Fase de Ranking -->
                <div class="sim-controls" id="rankingSimControls">
                    <div class="form-group">
                        <label>Novo Combatente</label>
                        <input type="text" id="newUsername" placeholder="@username">
                    </div>
                    <div class="form-group">
                        <label>Classe</label>
                        <select id="newClass">
                            <option value="Guerreiro">Guerreiro</option>
                            <option value="Assassino">Assassino</option>
                            <option value="Mago">Mago</option>
                            <option value="Tanque">Tanque</option>
                            <option value="Ninja">Ninja</option>
                        </select>
                    </div>
                    <button id="addPlayerBtn">Entrar na Arena</button>

                    <hr>

                    <div class="form-group">
                        <label>Enviar Presente (Ranking)</label>
                        <select id="targetPlayerSelect">
                            <option value="">Selecione o jogador...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Valor / Pontos</label>
                        <div class="gift-buttons-grid">
                            <button class="gift-btn" onclick="simGiftRanking(50)">+50</button>
                            <button class="gift-btn" onclick="simGiftRanking(200)">+200</button>
                            <button class="gift-btn" onclick="simGiftRanking(1000)">+1000</button>
                            <button class="gift-btn" onclick="simGiftRanking(2500)">+2500</button>
                        </div>
                    </div>

                    <hr>

                    <div class="form-group">
                        <label>Ações Rápidas</label>
                        <button onclick="Game.initDemoPlayers(25)" class="secondary">Popular com 25 Jogadores</button>
                    </div>
                </div>

                <!-- Controles para a Fase de Torneio (Regras Estritas de Apoio & Painel de Apoio) -->
                <div class="sim-controls" id="tournamentSimControls" style="display: none;">
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.4rem; line-height: 1.25;">
                        <strong>Regra de Apoio:</strong> Lutadores ativos apoiam a si mesmos. Espectadores e eliminados apoiam os lutadores atuais.
                    </div>
                    
                    <div class="form-group">
                        <label>Remetente (Quem envia)</label>
                        <select id="giftSenderSelect" onchange="UI.updateGiftTargetOptions()">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Alvo (Quem recebe)</label>
                        <select id="giftTargetSelect">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>🎁 APOIAR LUTADORES</label>
                        <div id="supportButtonsContainer" style="display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.2rem;">
                            <!-- Gerado dinamicamente para cada lutador ativo -->
                        </div>
                    </div>

                    <hr>

                    <div class="form-group">
                        <label>Valor Personalizado</label>
                        <div class="gift-buttons-grid">
                            <button class="gift-btn" onclick="submitCustomGift(10, 'Poção')">+10</button>
                            <button class="gift-btn" onclick="submitCustomGift(50, 'Poção')">+50</button>
                            <button class="gift-btn" onclick="submitCustomGift(100, 'Espada')">+100</button>
                            <button class="gift-btn" onclick="submitCustomGift(500, '👑 DRAGÃO')">+500</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * LWAR ARENA V1.4 — ARENA + STICKMAN COMBAT PROTOTYPE
         * Evolução incremental da V1.3 preservando todas as regras e arquitetura modular.
         */
        const DEBUG = true;

        const CONFIG = {
            MAX_ARENA_PLAYERS: 20,
            RANKING_PHASE_DURATION: 60,
            BATTLE_DURATION: 60,
            FRENZY_TRIGGER_TIME: 10,
            FRENZY_DAMAGE_MULT: 2.0
        };

        const gameState = {
            players: [],
            arenaPlayers: [],
            waitingPlayers: [],
            phase: 'RANKING', // 'RANKING' | 'TRANSITION' | 'TOURNAMENT' | 'CHAMPION'
            rankingTimer: CONFIG.RANKING_PHASE_DURATION,
            rankingInterval: null
        };

        const tournamentState = {
            active: false,
            players: [],
            currentIndex: 19,
            fighterA: null,
            fighterB: null,
            currentWinner: null,
            champion: null,
            battleTimer: CONFIG.BATTLE_DURATION,
            frenzy: false,
            battleInterval: null
        };

        function normalizeUsername(name) {
            if (!name) return "";
            let cleaned = name.trim();
            if (cleaned.startsWith('@')) cleaned = cleaned.substring(1);
            return '@' + cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
        }

        const EventBanner = {

        };

            classes: {

            getStats(className) {

        const RankManager = {
            getRank(points) {
                if (points >= 5000) return "Lendário";
                if (points >= 3000) return "Grão-Mestre";
                if (points >= 1800) return "Campeão";
                if (points >= 1000) return "Veterano";
                if (points >= 500)  return "Aventureiro";

        const GiftService = {
            listener: null,
            onGiftReceived(callback) {
                this.listener = callback;
            },
            processGift(senderName, targetName, coins, giftName = "Presente") {
                const normSender = normalizeUsername(senderName);
                const normTarget = normalizeUsername(targetName);
                const timestamp = Date.now();
                const phase = gameState.phase;

                const giftEvent = {
                    sender: normSender,
                    target: normTarget,
                    coins: Number(coins),
                    giftName: giftName,
                    timestamp: timestamp,
                    phase: phase
                };

                if (DEBUG) console.log(`[Gift] Evento processado:`, giftEvent);

                if (phase === 'RANKING') {
                    RankingManager.addOrUpdatePlayer(normTarget, null, giftEvent.coins);
                    EventBanner.show(`🎁 ${normSender} enviou ${giftName} (+${giftEvent.coins} pts) para ${normTarget}!`);
                } else if (phase === 'TOURNAMENT') {
                    const fA = tournamentState.fighterA;
                    const fB = tournamentState.fighterB;

                    if (!fA || !fB) return;

                    const isSenderFighterA = fA.username === normSender;
                    const isSenderFighterB = fB.username === normSender;
                    const isSenderActiveFighter = isSenderFighterA || isSenderFighterB;

                    let senderObj = gameState.players.find(p => p.username === normSender);
                    const isEliminated = senderObj && senderObj.status === 'eliminado';

                    // Regra estrita: Lutador ativo só pode enviar para si mesmo
                    if (isSenderActiveFighter) {
                        if (normSender !== normTarget) {
                            EventBanner.show(`❌ ${normSender} está lutando e só pode apoiar a si mesmo!`);
                            if (DEBUG) console.warn(`[Gift] Violação: Lutador ativo ${normSender} tentou apoiar ${normTarget}`);
                            return;
                        }
                    }

                    // Jogador eliminado não pode apoiar a si mesmo (já não luta)
                    if (isEliminated && normSender === normTarget) {
                        EventBanner.show(`❌ Jogadores eliminados não podem apoiar a si mesmos.`);
                        return;
                    }

                    if (normTarget !== fA.username && normTarget !== fB.username) {
                        EventBanner.show(`⚠️ ${normTarget} não está na batalha atual.`);
                        return;
                    }

                    const targetFighter = (fA.username === normTarget) ? fA : fB;
                    const bonusStrength = Math.floor(giftEvent.coins / 15);
                    const bonusHp = Math.floor(giftEvent.coins / 8);

                    targetFighter.strength += bonusStrength;
                    targetFighter.hp = Math.min(targetFighter.maxHp, targetFighter.hp + bonusHp);

                    EventBanner.show(`🔥 ${normSender} enviou ${giftName} para ${normTarget}! (+${bonusStrength} ATK, +${bonusHp} HP)`);

                    if (giftEvent.coins >= 500) {
                        UI.showLegendaryModal(normSender, normTarget, giftName, giftEvent.coins);
                    }

                    UI.renderTournamentBattle();
                }

                if (this.listener) {
                    this.listener(giftEvent);
                }
            }
        };

        const RankingManager = {
            addOrUpdatePlayer(username, charClass, pointsDelta) {
                if (gameState.phase !== 'RANKING') {
                    if (DEBUG) console.log(`[Ranking] Pontuação para ${username} ignorada: Ranking congelado.`);
                    return;
                }

                const normName = normalizeUsername(username);
                let player = gameState.players.find(p => p.username === normName);

                if (!player) {
                    const selectedClass = charClass || "Guerreiro";
                    const stats = ClassManager.getStats(selectedClass);
                    player = {
                        id: 'p_' + Math.random().toString(36).substr(2, 9),
                        username: normName,
                        charClass: selectedClass,
                        points: 0,
                        hp: stats.hp,
                        maxHp: stats.hp,
                        strength: stats.strength,
                        defense: stats.defense,
                        speed: stats.speed,
                        status: 'aguardando',
                        lastPointTimestamp: Date.now()
                    };
                    gameState.players.push(player);
                }

                if (pointsDelta) {
                    player.points += pointsDelta;
                    player.lastPointTimestamp = Date.now();
                }

                player.rank = RankManager.getRank(player.points);
                this.recalculateRanking();
            },

            recalculateRanking() {
                if (gameState.phase !== 'RANKING') return;

                gameState.players.sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    return a.lastPointTimestamp - b.lastPointTimestamp;
                });

                gameState.players.forEach((p, idx) => {
                    p.position = idx + 1;
                });

                gameState.arenaPlayers = gameState.players.slice(0, CONFIG.MAX_ARENA_PLAYERS);
                gameState.waitingPlayers = gameState.players.slice(CONFIG.MAX_ARENA_PLAYERS);

                gameState.arenaPlayers.forEach(p => {
                    p.status = 'ativo';
                    if (p.hp <= 0) p.hp = p.maxHp;
                });

                gameState.waitingPlayers.forEach(p => {
                    p.status = 'aguardando';
                });

                UI.renderRankingPhase();
            }
        };

        const TournamentManager = {
            initTournament() {
                if (gameState.phase === 'TOURNAMENT' || gameState.phase === 'CHAMPION') return;

                gameState.phase = 'TRANSITION';
                if (gameState.rankingInterval) clearInterval(gameState.rankingInterval);

                gameState.arenaPlayers.sort((a, b) => a.position - b.position);
                tournamentState.players = [...gameState.arenaPlayers];

                if (tournamentState.players.length < 2) {
                    alert("Necessário pelo menos 2 jogadores na arena para iniciar o torneio!");
                    gameState.phase = 'RANKING';
                    Game.startRankingTimer();
                    return;
                }

                if (DEBUG) console.log("[Tournament] Top 20 congelado com sucesso.");

                UI.renderTransitionScreen(() => {
                    gameState.phase = 'TOURNAMENT';
                    tournamentState.active = true;
                    tournamentState.currentIndex = tournamentState.players.length - 1;
                    this.startFirstMatch();
                });
            },

            startFirstMatch() {
                const len = tournamentState.players.length;
                tournamentState.fighterA = tournamentState.players[len - 1]; // 20º
                tournamentState.fighterB = tournamentState.players[len - 2]; // 19º
                tournamentState.currentIndex = len - 3;

                EventBanner.show(`⚔️ INÍCIO DO TORNEIO: ${tournamentState.fighterA.username} (20º) vs ${tournamentState.fighterB.username} (19º)`);
                this.setupMatch();
            },

            startNextMatch(winner) {
                tournamentState.currentWinner = winner;

                if (tournamentState.currentIndex < 0) {
                    const firstPlace = tournamentState.players[0];
                    if (winner.username === firstPlace.username) {
                        this.declareChampion(winner);
                        return;
                    }

                    tournamentState.fighterA = winner;
                    tournamentState.fighterB = firstPlace;
                    tournamentState.currentIndex = -99;

                    EventBanner.show(`👑 GRANDE FINAL: ${winner.username} VS O LÍDER ${firstPlace.username}!`);
                    this.setupMatch();
                    return;
                }

                if (tournamentState.currentIndex === -99) {
                    this.declareChampion(winner);
                    return;
                }

                tournamentState.fighterA = winner;
                tournamentState.fighterB = tournamentState.players[tournamentState.currentIndex];
                tournamentState.currentIndex--;

                EventBanner.show(`⚔️ PRÓXIMO CONFRONTO: ${winner.username} vs ${tournamentState.fighterB.username}`);
                this.setupMatch();
            },

            setupMatch() {
                tournamentState.fighterA.hp = tournamentState.fighterA.maxHp;
                tournamentState.fighterB.hp = tournamentState.fighterB.maxHp;
                tournamentState.fighterA.status = 'ativo';
                tournamentState.fighterB.status = 'ativo';

                tournamentState.battleTimer = CONFIG.BATTLE_DURATION;
                tournamentState.frenzy = false;

                BattleManager.startBattleTimer();
                UI.renderTournamentBattle();
            },

            declareChampion(champion) {
                gameState.phase = 'CHAMPION';
                tournamentState.active = false;
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                tournamentState.champion = champion;

                EventBanner.show(`🏆 ${champion.username} É O GRANDE CAMPEÃO DA LWAR ARENA! 🏆`, 6000);
                UI.renderChampionScreen(champion);
            }
        };

        const BattleManager = {
            startBattleTimer() {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);

                tournamentState.battleInterval = setInterval(() => {
                    if (gameState.phase !== 'TOURNAMENT') return;

                    tournamentState.battleTimer--;

                    if (tournamentState.battleTimer <= CONFIG.FRENZY_TRIGGER_TIME && !tournamentState.frenzy) {
                        tournamentState.frenzy = true;
                        EventBanner.show("🔥 FRENESI ATIVADO! DANO EM DOBRO! 🔥");
                    }

                    if (tournamentState.battleTimer <= 0) {
                        this.resolveBattleByTimeout();
                    }

                    UI.updateTournamentTimer();
                    this.tickCombat();
                }, 1000);
            },

            tickCombat() {
                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;
                if (!fA || !fB) return;
                if (fA.hp <= 0 || fB.hp <= 0) return;

                const isATurn = Math.random() < 0.5;
                const attacker = isATurn ? fA : fB;
                const defender = isATurn ? fB : fA;

                const frenzyMult = tournamentState.frenzy ? CONFIG.FRENZY_DAMAGE_MULT : 1.0;
                const damage = Math.max(8, Math.floor((attacker.strength * 1.2 - defenseCalc(defender)) * frenzyMult));

                defender.hp = Math.max(0, defender.hp - damage);

                // Disparar animações visuais de ataque, dano e números flutuantes
                UI.triggerAttackAnimation(attacker.id, isATurn ? 'left' : 'right');
                UI.triggerDamageEffect(defender.id, damage);
                UI.renderTournamentBattle();

                EventBanner.show(`⚔️ ${attacker.username} atacou ${defender.username} (-${damage} HP)`);

                if (defender.hp <= 0) {
                    this.endBattle(attacker, defender);
                }
            },

            resolveBattleByTimeout() {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;

                let winner, loser;
                if (fA.hp > fB.hp) { winner = fA; loser = fB; }
                else if (fB.hp > fA.hp) { winner = fB; loser = fA; }
                else {
                    winner = fA.strength >= fB.strength ? fA : fB;
                    loser = winner === fA ? fB : fA;
                }

                EventBanner.show(`⏱️ Fim do Tempo! ${winner.username} venceu por HP restante.`);
                this.endBattle(winner, loser);
            },

            endBattle(winner, loser) {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                loser.status = 'eliminado';
                winner.status = 'ativo';

                UI.renderMatchResult(winner, loser, () => {
                    TournamentManager.startNextMatch(winner);
                });
            }
        };

        function defenseCalc(defender) {
            return defender.defense * 0.4;
        }

                const container = document.getElementById('arenaContainer');
                container.innerHTML = `

            updateTournamentTimer() {
                const timerBox = document.getElementById('mainTimer');
                const m = String(Math.floor(tournamentState.battleTimer / 60)).padStart(2, '0');
                const s = String(tournamentState.battleTimer % 60).padStart(2, '0');
                timerBox.innerText = `${m}:${s}`;
                if (tournamentState.frenzy) timerBox.classList.add('frenzy');
                else timerBox.classList.remove('frenzy');
            },

            updateRankingTimerDisplay() {
                const timerBox = document.getElementById('mainTimer');
                const m = String(Math.floor(gameState.rankingTimer / 60)).padStart(2, '0');
                const s = String(gameState.rankingTimer % 60).padStart(2, '0');
                timerBox.innerText = `${m}:${s}`;
                timerBox.classList.remove('frenzy');
            },

            populateTargetSelect() {
                const select = document.getElementById('targetPlayerSelect');
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '<option value="">Selecione o jogador...</option>';
                gameState.players.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.username;
                    opt.innerText = `${p.username} (${p.points} pts)`;
                    select.appendChild(opt);
                });
                select.value = currentVal;
            },

            updateGiftSenderOptions() {
                const senderSelect = document.getElementById('giftSenderSelect');
                if (!senderSelect) return;
                senderSelect.innerHTML = '';
                gameState.players.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.username;
                    opt.innerText = `${p.username} (${p.status})`;
                    senderSelect.appendChild(opt);
                });
                this.updateGiftTargetOptions();
            },

            updateGiftTargetOptions() {
                const senderSelect = document.getElementById('giftSenderSelect');
                const targetSelect = document.getElementById('giftTargetSelect');
                if (!senderSelect || !targetSelect) return;

                const senderName = senderSelect.value;
                targetSelect.innerHTML = '';

                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;
                if (!fA || !fB) return;

                const isFighterA = fA.username === senderName;
                const isFighterB = fB.username === senderName;

                if (isFighterA || isFighterB) {
                    const opt = document.createElement('option');
                    opt.value = senderName;
                    opt.innerText = `${senderName} (Auto-apoio)`;
                    targetSelect.appendChild(opt);
                } else {
                    [fA, fB].forEach(fighter => {
                        const opt = document.createElement('option');
                        opt.value = fighter.username;
                        opt.innerText = `${fighter.username} (Lutador Ativo)`;
                        targetSelect.appendChild(opt);
                    });
                }
            },

            renderSupportButtons() {
                const container = document.getElementById('supportButtonsContainer');
                if (!container) return;
                container.innerHTML = '';

                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;
                if (!fA || !fB) return;

                [fA, fB].forEach(fighter => {
                    const div = document.createElement('div');
                    div.style.display = 'flex';
                    div.style.flexDirection = 'column';
                    div.style.gap = '0.2rem';
                    div.innerHTML = `
                        <div style="font-size: 0.7rem; color: var(--gold); font-weight: bold;">⚔️ ${fighter.username}</div>
                        <div class="gift-buttons-grid">
                            <button class="gift-btn" onclick="supportFighter('${fighter.username}', 10)">+10</button>
                            <button class="gift-btn" onclick="supportFighter('${fighter.username}', 50)">+50</button>
                            <button class="gift-btn" onclick="supportFighter('${fighter.username}', 100)">+100</button>
                            <button class="gift-btn" onclick="supportFighter('${fighter.username}', 500)">+500</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            },

            showLegendaryModal(sender, target, giftName, coins) {
                document.getElementById('legendaryDesc').innerHTML = `<strong>${sender}</strong> enviou um espetacular <strong>${giftName}</strong> (${coins} moedas) para <strong>${target}</strong>!`;
                document.getElementById('legendaryModalOverlay').style.display = 'flex';
            },

            closeLegendaryModal() {
                document.getElementById('legendaryModalOverlay').style.display = 'none';
            },

            triggerAttackAnimation(id, side) {
                const pod = document.getElementById(`pod_${id}`);
                if (pod) {
                    const stickman = pod.querySelector('.stickman-container');
                    if (stickman) {
                        const animClass = side === 'left' ? 'attacking-left' : 'attacking-right';
                        stickman.classList.add(animClass);
                        setTimeout(() => stickman.classList.remove(animClass), 350);
                    }
                }
            },

            triggerDamageEffect(id, damage) {
                const pod = document.getElementById(`pod_${id}`);
                if (pod) {
                    const stickman = pod.querySelector('.stickman-container');
                    if (stickman) {
                        stickman.classList.add('taking-damage');
                        setTimeout(() => stickman.classList.remove('taking-damage'), 300);
                    }

                    // Criar número de dano flutuante
                    const dmgFloat = document.createElement('div');
                    dmgFloat.className = 'floating-damage';
                    dmgFloat.innerText = `-${damage}`;
                    pod.appendChild(dmgFloat);
                    setTimeout(() => dmgFloat.remove(), 900);
                }
            }
        };

        const Game = {
            initDemoPlayers(count = 25) {
                const classes = Object.keys(ClassManager.classes);
                const names = ["Arthur", "Lancelot", "Merlin", "Morgana", "Tristan", "Gawain", "Perceval", "Galahad", "Mordred", "Bedivere", "Urien", "Bors", "Kay", "Lamorak", "Pellinore", "Agravain", "Gaheris", "Geraint", "Caradoc", "Ywain", "Dinadan", "Brunor", "Segwarides", "Safir", "Morholt"];
                for (let i = 0; i < count; i++) {
                    const name = names[i % names.length] + (i >= names.length ? i : '');
                    const cClass = classes[Math.floor(Math.random() * classes.length)];
                    const pts = Math.floor(Math.random() * 900) + 100;
                    RankingManager.addOrUpdatePlayer(name, cClass, pts);
                }
            },

            startRankingTimer() {
                if (gameState.rankingInterval) clearInterval(gameState.rankingInterval);
                gameState.rankingInterval = setInterval(() => {
                    if (gameState.phase !== 'RANKING') return;
                    gameState.rankingTimer--;
                    UI.updateRankingTimerDisplay();
                    if (gameState.rankingTimer <= 0) {
                        clearInterval(gameState.rankingInterval);
                        TournamentManager.initTournament();
                    }
                }, 1000);
            }
        };

        document.getElementById('addPlayerBtn').addEventListener('click', () => {
            if (gameState.phase !== 'RANKING') {
                alert("O ranking está congelado. Novos combatentes não podem entrar.");
                return;
            }
            const input = document.getElementById('newUsername');
            const classSelect = document.getElementById('newClass');
            const username = input.value.trim();
            if (!username) return alert("Insira um nome válido!");
            RankingManager.addOrUpdatePlayer(username, classSelect.value, 150);
            input.value = '';
        });

        document.getElementById('skipRankingBtn').addEventListener('click', () => {
            if (gameState.phase === 'RANKING') {
                TournamentManager.initTournament();
            }
        });

        function simGiftRanking(coins) {
            const select = document.getElementById('targetPlayerSelect');
            const target = select.value;
            if (!target) return alert("Selecione um alvo no ranking!");
            GiftService.processGift("@EspectadorX", target, coins, "Oferenda");
        }

        function submitCustomGift(coins, giftName) {
            const sender = document.getElementById('giftSenderSelect').value;
            const target = document.getElementById('giftTargetSelect').value;
            if (!sender || !target) return alert("Selecione remetente e alvo válidos.");
            GiftService.processGift(sender, target, coins, giftName);
        }

        function supportFighter(targetName, coins) {
            const sender = document.getElementById('giftSenderSelect').value;
            if (!sender) return alert("Selecione quem está enviando no campo Remetente.");
            GiftService.processGift(sender, targetName, coins, coins >= 500 ? '👑 DRAGÃO' : 'Poção');
        }

        window.addEventListener('DOMContentLoaded', () => {
            Game.initDemoPlayers(25);
            UI.updateRankingTimerDisplay();
            Game.startRankingTimer();
        });
    </script>
</body>
</html>
