<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LWAR ARENA V1.3 — RPG Foundation</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-obsidian: #0b0f19;
            --panel-stone: #131b2e;
            --panel-border: #2a3a5e;
            --panel-border-gold: #c5a059;
            --gold: #f3d179;
            --gold-dark: #b8860b;
            --accent-red: #991b1b;
            --accent-red-bright: #ef4444;
            --hp-green: #15803d;
            --hp-green-bright: #22c55e;
            --magic-cyan: #0ea5e9;
            --rare-purple: #9333ea;
            --frenzy-orange: #ea580c;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cinzel', 'Georgia', serif, sans-serif;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1a2744 0%, #0b0f19 100%);
        }

        header {
            background-color: var(--panel-stone);
            border-bottom: 3px solid var(--panel-border-gold);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(243, 209, 121, 0.4);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .battle-status {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .phase-indicator {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-box {
            background: #05070c;
            border: 2px solid var(--panel-border-gold);
            padding: 0.4rem 1.2rem;
            border-radius: 4px;
            font-size: 1.3rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
            color: var(--gold);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .timer-box.frenzy {
            border-color: var(--frenzy-orange);
            color: var(--frenzy-orange);
            animation: frenzyPulse 0.6s infinite alternate;
        }

        @keyframes frenzyPulse {
            from { transform: scale(1); box-shadow: 0 0 5px var(--frenzy-orange); }
            to { transform: scale(1.04); box-shadow: 0 0 20px var(--frenzy-orange); }
        }

        /* Layout Principal Responsivo */
        main {
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            max-width: 100vw;
            overflow-x: hidden;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
        }

        .panel {
            background-color: var(--panel-stone);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .panel-header {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            padding: 0.75rem 1rem;
            font-weight: bold;
            border-bottom: 2px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--gold);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .panel-body {
            padding: 0.75rem;
            overflow-y: auto;
            flex: 1;
            max-height: calc(100vh - 180px);
        }

        /* Listas de Ranking Estilo Pergaminho/Pedra */
        .ranking-list, .waiting-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .ranking-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--panel-border);
            padding: 0.45rem 0.6rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border-left: 4px solid var(--panel-border-gold);
            transition: all 0.2s;
        }

        .ranking-item.top-tier {
            border-left-color: var(--gold);
            background: rgba(197, 160, 89, 0.08);
        }

        .ranking-item.waiting {
            opacity: 0.5;
            border-left-color: var(--text-muted);
        }

        .ranking-item.champion-badge {
            border-left-color: var(--gold);
            background: rgba(243, 209, 121, 0.15);
            animation: glowGold 1.5s infinite alternate;
        }

        @keyframes glowGold {
            from { box-shadow: 0 0 5px rgba(243, 209, 121, 0.2); }
            to { box-shadow: 0 0 15px rgba(243, 209, 121, 0.6); }
        }

        /* Arena Central com Tema de Fantasia Sombria */
        .arena-container {
            position: relative;
            background: radial-gradient(circle at center, #1b263b 0%, #090d16 100%);
            border: 3px solid var(--panel-border-gold);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 480px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
        }

        /* Banner de Eventos no Topo da Arena */
        .event-banner-container {
            width: 100%;
            height: 45px;
            background: linear-gradient(to right, transparent, rgba(15, 23, 42, 0.9), transparent);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .event-banner-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--gold);
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(243, 209, 121, 0.6);
            animation: slideInBanner 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        @keyframes slideInBanner {
            from { opacity: 0; transform: translateY(-15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .arena-grid {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 1rem;
            gap: 0.75rem;
            overflow-y: auto;
            justify-content: center;
        }

        /* Cards de Personagem na Fase de Ranking */
        .arena-fighter-card {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 0.6rem;
            width: 130px;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            position: relative;
        }

        .arena-fighter-card .name {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--gold);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arena-fighter-card .class {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Arena de Batalha 1v1 do Torneio */
        .tournament-arena-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        .vs-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 650px;
        }

        .fighter-battle-card {
            background: linear-gradient(135deg, #1e293b 0%, #090d16 100%);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            padding: 1rem;
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            transition: transform 0.2s;
        }

        .fighter-battle-card.active-attacker {
            border-color: var(--accent-red-bright);
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .fighter-battle-card.eliminated {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        .fighter-battle-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--gold);
        }

        .hp-bar-container {
            background: #03050a;
            border-radius: 4px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            position: relative;
        }

        .hp-bar-fill {
            background: linear-gradient(to right, #16a34a, #22c55e);
            height: 100%;
            width: 100%;
            transition: width 0.4s ease;
        }

        .fighter-stats-grid {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .vs-badge-epic {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-red-bright);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            animation: vsPulse 1.2s infinite alternate;
        }

        @keyframes vsPulse {
            from { transform: scale(1); text-shadow: 0 0 10px rgba(239,68,68,0.5); }
            to { transform: scale(1.1); text-shadow: 0 0 25px rgba(239,68,68,0.9); }
        }

        .transition-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            text-align: center;
            padding: 2rem;
            height: 100%;
        }

        .transition-screen h2 {
            font-size: 2rem;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(243, 209, 121, 0.6);
            letter-spacing: 2px;
        }

        /* Modal de Presente Lendário / Épico */
        #legendaryModalOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 12, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .legendary-popup {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 3px solid var(--gold);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 40px rgba(243, 209, 121, 0.4);
            animation: popupScale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popupScale {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Controles, Formulários e Botões Estilo RPG */
        .sim-controls {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        label {
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, select {
            background: #090d16;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.45rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        input:focus, select:focus {
            border-color: var(--gold);
            outline: none;
        }

        button {
            background: linear-gradient(to bottom, #c5a059, #9a7b38);
            color: #0b0f19;
            border: 1px solid var(--gold);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        button:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
        }

        button.danger {
            background: linear-gradient(to bottom, #ef4444, #991b1b);
            border-color: #ef4444;
            color: white;
        }

        button.secondary {
            background: linear-gradient(to bottom, #334155, #1e293b);
            border-color: var(--panel-border);
            color: var(--text-main);
        }

        .gift-buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.35rem;
            margin-top: 0.25rem;
        }

        .gift-btn {
            background: #1e293b;
            color: var(--gold);
            border: 1px solid var(--panel-border);
            font-size: 0.75rem;
            padding: 0.35rem;
        }

        hr {
            border-color: var(--panel-border);
            margin: 0.4rem 0;
        }
    </style>
</head>
<body>

    <!-- Popup Especial para Presentes Lendários -->
    <div id="legendaryModalOverlay">
        <div class="legendary-popup">
            <h3 style="color: var(--gold); font-size: 1.4rem; margin-bottom: 0.5rem;" id="legendaryTitle">🎁 PRESENTE LENDÁRIO 🎁</h3>
            <p id="legendaryDesc" style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-main);"></p>
            <button onclick="UI.closeLegendaryModal()">INCRÍVEL!</button>
        </div>
    </div>

    <header>
        <div class="logo">⚔️ LWAR ARENA <span style="font-size: 0.8rem; color: var(--text-muted);">V1.3 RPG</span></div>
        <div class="battle-status">
            <div class="phase-indicator" id="phaseStatusText">Disputa Top 20</div>
            <div class="timer-box" id="mainTimer">01:00</div>
        </div>
        <div>
            <button id="skipRankingBtn" class="secondary" style="font-size: 0.75rem;">Iniciar Torneio</button>
        </div>
    </header>

    <main>
        <!-- Painel Esquerdo: Ranking / Fila / Bracket -->
        <div class="panel">
            <div class="panel-header" id="leftPanelHeader">
                <span>🏆 TOP 20 ATIVO</span>
                <span id="topCount" style="font-size: 0.75rem; color: var(--gold);">0/20</span>
            </div>
            <div class="panel-body">
                <ul class="ranking-list" id="top20List">
                    <!-- Preenchido via JS -->
                </ul>
                <div id="waitingSection" style="margin-top: 1rem;">
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; font-weight: bold;">Fila de Espera (21+)</div>
                    <ul class="waiting-list" id="waitingList">
                        <!-- Preenchido via JS -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Painel Central: Arena Medieval / Torneio 1v1 -->
        <div class="arena-container" id="arenaContainer">
            <!-- Event Banner no Topo da Arena -->
            <div class="event-banner-container" id="eventBannerContainer">
                <div class="event-banner-text" id="eventBannerText">⚔️ BEM-VINDO À LWAR ARENA V1.3 ⚔️</div>
            </div>

            <div style="position: absolute; bottom: 8px; left: 12px; font-size: 0.7rem; color: var(--text-muted); z-index: 10;" id="arenaSubheader">
                Visualização da Arena (Top 20)
            </div>

            <div class="arena-grid" id="arenaGrid">
                <!-- Cards dos lutadores da arena renderizados via JS -->
            </div>
        </div>

        <!-- Painel Direito: Simulador de Eventos / Sistema de Apoiadores -->
        <div class="panel">
            <div class="panel-header">
                <span id="simPanelTitle">🧪 Simulador de Eventos</span>
            </div>
            <div class="panel-body">
                <!-- Controles para a Fase de Ranking -->
                <div class="sim-controls" id="rankingSimControls">
                    <div class="form-group">
                        <label>Novo Combatente</label>
                        <input type="text" id="newUsername" placeholder="@username">
                    </div>
                    <div class="form-group">
                        <label>Classe</label>
                        <select id="newClass">
                            <option value="Guerreiro">Guerreiro</option>
                            <option value="Assassino">Assassino</option>
                            <option value="Mago">Mago</option>
                            <option value="Tanque">Tanque</option>
                            <option value="Ninja">Ninja</option>
                        </select>
                    </div>
                    <button id="addPlayerBtn">Entrar na Arena</button>

                    <hr>

                    <div class="form-group">
                        <label>Enviar Presente (Ranking)</label>
                        <select id="targetPlayerSelect">
                            <option value="">Selecione o jogador...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Valor / Pontos</label>
                        <div class="gift-buttons-grid">
                            <button class="gift-btn" onclick="simGiftRanking(50)">+50</button>
                            <button class="gift-btn" onclick="simGiftRanking(200)">+200</button>
                            <button class="gift-btn" onclick="simGiftRanking(1000)">+1000</button>
                        </div>
                    </div>

                    <hr>

                    <div class="form-group">
                        <label>Ações Rápidas</label>
                        <button onclick="Game.initDemoPlayers(25)" class="secondary">Popular com 25 Jogadores</button>
                    </div>
                </div>

                <!-- Controles para a Fase de Torneio (Regras Estritas de Apoio) -->
                <div class="sim-controls" id="tournamentSimControls" style="display: none;">
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; line-height: 1.3;">
                        <strong>Regra de Apoio:</strong> Lutadores só apoiam a si mesmos. Espectadores e eliminados apoiam qualquer ativo.
                    </div>
                    
                    <div class="form-group">
                        <label>Remetente (Quem envia)</label>
                        <select id="giftSenderSelect" onchange="UI.updateGiftTargetOptions()">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Alvo (Quem recebe)</label>
                        <select id="giftTargetSelect">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tipo de Presente</label>
                        <div class="gift-buttons-grid">
                            <button class="gift-btn" onclick="submitCustomGift(50, 'Poção')">Poção (50)</button>
                            <button class="gift-btn" onclick="submitCustomGift(300, 'Espada')">Espada (300)</button>
                            <button class="gift-btn" onclick="submitCustomGift(1200, '👑 DRAGÃO')">DRAGÃO (1200)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * LWAR ARENA V1.3 — RPG FOUNDATION
         * Arquitetura Modular Consolidada com Correções de Segurança e Interface RPG
         */
        const DEBUG = true;

        const CONFIG = {
            MAX_ARENA_PLAYERS: 20,
            RANKING_PHASE_DURATION: 60, // Segundos para a fase de ranking
            BATTLE_DURATION: 60,
            FRENZY_TRIGGER_TIME: 10,
            FRENZY_DAMAGE_MULT: 2.0
        };

        // Estado Global Consolidado
        const gameState = {
            players: [],
            arenaPlayers: [],
            waitingPlayers: [],
            phase: 'RANKING', // 'RANKING' | 'TRANSITION' | 'TOURNAMENT' | 'CHAMPION'
            rankingTimer: CONFIG.RANKING_PHASE_DURATION,
            rankingInterval: null
        };

        // Estado do Torneio V1.3
        const tournamentState = {
            active: false,
            players: [],          // Cópia congelada do Top 20 ordenado (0 = 1º, 19 = 20º)
            currentIndex: 19,     // Aponta para o desafiante atual (começa no 20º, índice 19)
            fighterA: null,       // Lutador A (ex: 20º)
            fighterB: null,       // Lutador B (ex: 19º)
            currentWinner: null,
            champion: null,
            battleTimer: CONFIG.BATTLE_DURATION,
            frenzy: false,
            battleInterval: null
        };

        // Normalizador robusto de nomes para evitar duplicatas (@ vs sem @)
        function normalizeUsername(name) {
            if (!name) return "";
            let cleaned = name.trim();
            if (cleaned.startsWith('@')) cleaned = cleaned.substring(1);
            return '@' + cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
        }

        // EventBanner Manager (Sistema de mensagens deslizantes no topo da arena)
        const EventBanner = {
            show(message, duration = 3500) {
                const bannerText = document.getElementById('eventBannerText');
                if (!bannerText) return;
                bannerText.innerText = message;
                // Reiniciar animação CSS
                bannerText.style.animation = 'none';
                bannerText.offsetHeight; // Trigger reflow
                bannerText.style.animation = 'slideInBanner 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                if (DEBUG) console.log(`[Event] ${message}`);
            }
        };

        // ClassManager: Atributos de Classe
        const ClassManager = {
            classes: {
                Guerreiro: { hp: 130, strength: 24, defense: 16, speed: 10 },
                Assassino: { hp: 95,  strength: 36, defense: 8,  speed: 24 },
                Mago:      { hp: 85,  strength: 42, defense: 6,  speed: 16 },
                Tanque:    { hp: 170, strength: 18, defense: 26, speed: 6  },
                Ninja:     { hp: 105, strength: 32, defense: 10, speed: 28 }
            },
            getStats(className) {
                return this.classes[className] || this.classes.Guerreiro;
            }
        };

        // RankManager:progressão de Títulos
        const RankManager = {
            getRank(points) {
                if (points >= 5000) return "Lendário";
                if (points >= 3000) return "Grão-Mestre";
                if (points >= 1800) return "Campeão";
                if (points >= 1000) return "Veterano";
                if (points >= 500)  return "Aventureiro";
                return "Novato";
            }
        };

        // GiftService V1.3: Estrutura Padronizada com Regras de Validação Estritas
        const GiftService = {
            listener: null,
            onGiftReceived(callback) {
                this.listener = callback;
            },
            processGift(senderName, targetName, coins, giftName = "Presente") {
                const normSender = normalizeUsername(senderName);
                const normTarget = normalizeUsername(targetName);
                const timestamp = Date.now();
                const phase = gameState.phase;

                const giftEvent = {
                    sender: normSender,
                    target: normTarget,
                    coins: Number(coins),
                    giftName: giftName,
                    timestamp: timestamp,
                    phase: phase
                };

                if (DEBUG) console.log(`[Gift] Evento processado:`, giftEvent);

                // Validações de Fase e Regras de Combate
                if (phase === 'RANKING') {
                    // Na fase de ranking, qualquer um pode enviar pontos para qualquer jogador (adiciona ao ranking)
                    RankingManager.addOrUpdatePlayer(normTarget, null, giftEvent.coins);
                    EventBanner.show(`🎁 ${normSender} enviou ${giftName} (+${giftEvent.coins} pts) para ${normTarget}!`);
                } else if (phase === 'TOURNAMENT') {
                    // Validar regras estritas de combate para o torneio
                    const fA = tournamentState.fighterA;
                    const fB = tournamentState.fighterB;

                    if (!fA || !fB) return;

                    const isSenderFighterA = fA.username === normSender;
                    const isSenderFighterB = fB.username === normSender;
                    const isSenderActiveFighter = isSenderFighterA || isSenderFighterB;

                    let senderObj = gameState.players.find(p => p.username === normSender);
                    const isEliminated = senderObj && senderObj.status === 'eliminado';

                    // Regra 1: Lutador ativo SÓ pode enviar para si mesmo
                    if (isSenderActiveFighter) {
                        if (normSender !== normTarget) {
                            EventBanner.show(`❌ ${normSender} está lutando e só pode apoiar a si mesmo!`);
                            if (DEBUG) console.warn(`[Gift] Violação de regra: Lutador ativo ${normSender} tentou apoiar ${normTarget}`);
                            return;
                        }
                    }

                    // Regra 2: Jogador eliminado NÃO pode apoiar a si mesmo (já que não é mais lutador)
                    if (isEliminated && normSender === normTarget) {
                        EventBanner.show(`❌ Jogadores eliminados não podem apoiar a si mesmos.`);
                        return;
                    }

                    // Validar se o alvo é um dos combatentes atuais da batalha
                    if (normTarget !== fA.username && normTarget !== fB.username) {
                        EventBanner.show(`⚠️ ${normTarget} não está na batalha atual.`);
                        return;
                    }

                    // Aplicar Efeito de Batalha no Alvo Correto
                    const targetFighter = (fA.username === normTarget) ? fA : fB;
                    const bonusStrength = Math.floor(giftEvent.coins / 15);
                    const bonusHp = Math.floor(giftEvent.coins / 8);

                    targetFighter.strength += bonusStrength;
                    targetFighter.hp = Math.min(targetFighter.maxHp, targetFighter.hp + bonusHp);

                    EventBanner.show(`🔥 ${normSender} enviou ${giftName} para ${normTarget}! (+${bonusStrength} ATK, +${bonusHp} HP)`);

                    // Se for presente grande (>= 1000 coins), disparar modal lendário
                    if (giftEvent.coins >= 1000) {
                        UI.showLegendaryModal(normSender, normTarget, giftName, giftEvent.coins);
                    }

                    UI.renderTournamentBattle();
                }

                if (this.listener) {
                    this.listener(giftEvent);
                }
            }
        };

        // RankingManager
        const RankingManager = {
            addOrUpdatePlayer(username, charClass, pointsDelta) {
                if (gameState.phase !== 'RANKING') {
                    if (DEBUG) console.log(`[Ranking] Pontuação para ${username} ignorada: Ranking congelado.`);
                    return;
                }

                const normName = normalizeUsername(username);
                let player = gameState.players.find(p => p.username === normName);

                if (!player) {
                    const selectedClass = charClass || "Guerreiro";
                    const stats = ClassManager.getStats(selectedClass);
                    player = {
                        id: 'p_' + Math.random().toString(36).substr(2, 9),
                        username: normName,
                        charClass: selectedClass,
                        points: 0,
                        hp: stats.hp,
                        maxHp: stats.hp,
                        strength: stats.strength,
                        defense: stats.defense,
                        speed: stats.speed,
                        status: 'aguardando',
                        lastPointTimestamp: Date.now()
                    };
                    gameState.players.push(player);
                }

                if (pointsDelta) {
                    player.points += pointsDelta;
                    player.lastPointTimestamp = Date.now();
                }

                player.rank = RankManager.getRank(player.points);
                this.recalculateRanking();
            },

            recalculateRanking() {
                if (gameState.phase !== 'RANKING') return;

                // Ordenar por pontos (decrescente) e timestamp (mais antigo primeiro em empate)
                gameState.players.sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    return a.lastPointTimestamp - b.lastPointTimestamp;
                });

                gameState.players.forEach((p, idx) => {
                    p.position = idx + 1;
                });

                gameState.arenaPlayers = gameState.players.slice(0, CONFIG.MAX_ARENA_PLAYERS);
                gameState.waitingPlayers = gameState.players.slice(CONFIG.MAX_ARENA_PLAYERS);

                gameState.arenaPlayers.forEach(p => {
                    p.status = 'ativo';
                    if (p.hp <= 0) p.hp = p.maxHp;
                });

                gameState.waitingPlayers.forEach(p => {
                    p.status = 'aguardando';
                });

                UI.renderRankingPhase();
            }
        };

        // TournamentManager: Fluxo Oficial do Torneio
        const TournamentManager = {
            initTournament() {
                if (gameState.phase === 'TOURNAMENT' || gameState.phase === 'CHAMPION') return;

                gameState.phase = 'TRANSITION';
                if (gameState.rankingInterval) clearInterval(gameState.rankingInterval);

                // Congelar e ordenar Top 20 (1º ao 20º)
                gameState.arenaPlayers.sort((a, b) => a.position - b.position);
                tournamentState.players = [...gameState.arenaPlayers];

                if (tournamentState.players.length < 2) {
                    alert("Necessário pelo menos 2 jogadores na arena para iniciar o torneio!");
                    gameState.phase = 'RANKING';
                    Game.startRankingTimer();
                    return;
                }

                if (DEBUG) console.log("[Tournament] Top 20 congelado com sucesso.");

                UI.renderTransitionScreen(() => {
                    gameState.phase = 'TOURNAMENT';
                    tournamentState.active = true;
                    // Começa no 20º vs 19º (índices len - 1 e len - 2)
                    tournamentState.currentIndex = tournamentState.players.length - 1;
                    this.startFirstMatch();
                });
            },

            startFirstMatch() {
                const len = tournamentState.players.length;
                tournamentState.fighterA = tournamentState.players[len - 1]; // 20º
                tournamentState.fighterB = tournamentState.players[len - 2]; // 19º
                tournamentState.currentIndex = len - 3; // Próximo desafiante será o 18º

                EventBanner.show(`⚔️ INÍCIO DO TORNEIO: ${tournamentState.fighterA.username} (20º) vs ${tournamentState.fighterB.username} (19º)`);
                this.setupMatch();
            },

            startNextMatch(winner) {
                tournamentState.currentWinner = winner;

                if (tournamentState.currentIndex < 0) {
                    // Chegamos ao topo! O vencedor atual enfrenta o 1º colocado (índice 0) na GRANDE FINAL
                    const firstPlace = tournamentState.players[0];
                    if (winner.username === firstPlace.username) {
                        this.declareChampion(winner);
                        return;
                    }

                    tournamentState.fighterA = winner;
                    tournamentState.fighterB = firstPlace;
                    tournamentState.currentIndex = -99; // Marcador de Grande Final

                    EventBanner.show(`👑 GRANDE FINAL: ${winner.username} VS O LÍDER ${firstPlace.username}!`);
                    this.setupMatch();
                    return;
                }

                if (tournamentState.currentIndex === -99) {
                    this.declareChampion(winner);
                    return;
                }

                // Confronto progressivo normal
                tournamentState.fighterA = winner;
                tournamentState.fighterB = tournamentState.players[tournamentState.currentIndex];
                tournamentState.currentIndex--;

                EventBanner.show(`⚔️ PRÓXIMO CONFRONTO: ${winner.username} vs ${tournamentState.fighterB.username}`);
                this.setupMatch();
            },

            setupMatch() {
                tournamentState.fighterA.hp = tournamentState.fighterA.maxHp;
                tournamentState.fighterB.hp = tournamentState.fighterB.maxHp;
                tournamentState.fighterA.status = 'ativo';
                tournamentState.fighterB.status = 'ativo';

                tournamentState.battleTimer = CONFIG.BATTLE_DURATION;
                tournamentState.frenzy = false;

                BattleManager.startBattleTimer();
                UI.renderTournamentBattle();
            },

            declareChampion(champion) {
                gameState.phase = 'CHAMPION';
                tournamentState.active = false;
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                tournamentState.champion = champion;

                EventBanner.show(`🏆 ${champion.username} É O GRANDE CAMPEÃO DA LWAR ARENA! 🏆`, 6000);
                UI.renderChampionScreen(champion);
            }
        };

        // BattleManager: Batalha individual de 60s com Frenesi e Proteções contra duplicação de timers
        const BattleManager = {
            startBattleTimer() {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);

                tournamentState.battleInterval = setInterval(() => {
                    if (gameState.phase !== 'TOURNAMENT') return;

                    tournamentState.battleTimer--;

                    if (tournamentState.battleTimer <= CONFIG.FRENZY_TRIGGER_TIME && !tournamentState.frenzy) {
                        tournamentState.frenzy = true;
                        EventBanner.show("🔥 FRENESI ATIVADO! DANO EM DOBRO! 🔥");
                    }

                    if (tournamentState.battleTimer <= 0) {
                        this.resolveBattleByTimeout();
                    }

                    UI.updateTournamentTimer();
                    this.tickCombat();
                }, 1000);
            },

            tickCombat() {
                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;
                if (!fA || !fB) return;
                if (fA.hp <= 0 || fB.hp <= 0) return;

                const attacker = Math.random() < 0.5 ? fA : fB;
                const defender = attacker === fA ? fB : fA;

                const frenzyMult = tournamentState.frenzy ? CONFIG.FRENZY_DAMAGE_MULT : 1.0;
                const damage = Math.max(6, Math.floor((attacker.strength * 1.2 - defender.defense * 0.4) * frenzyMult));

                defender.hp = Math.max(0, defender.hp - damage);

                UI.flashAttacker(attacker.id);
                UI.renderTournamentBattle();

                if (defender.hp <= 0) {
                    this.endBattle(attacker, defender);
                }
            },

            resolveBattleByTimeout() {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                const fA = tournamentState.fighterA;
                const fB = tournamentState.fighterB;

                let winner, loser;
                if (fA.hp > fB.hp) { winner = fA; loser = fB; }
                else if (fB.hp > fA.hp) { winner = fB; loser = fA; }
                else {
                    winner = fA.strength >= fB.strength ? fA : fB;
                    loser = winner === fA ? fB : fA;
                }

                EventBanner.show(`⏱️ Fim do Tempo! ${winner.username} venceu por HP restante.`);
                this.endBattle(winner, loser);
            },

            endBattle(winner, loser) {
                if (tournamentState.battleInterval) clearInterval(tournamentState.battleInterval);
                loser.status = 'eliminado';
                winner.status = 'ativo';

                UI.renderMatchResult(winner, loser, () => {
                    TournamentManager.startNextMatch(winner);
                });
            }
        };

            const select = document.getElementById('targetPlayerSelect');
            const target = select.value;
            if (!target) return alert("Selecione um alvo no ranking!");
            GiftService.processGift("@EspectadorX", target, coins, "Oferenda");
        }

        function submitCustomGift(coins, giftName) {
            const sender = document.getElementById('giftSenderSelect').value;
            const target = document.getElementById('giftTargetSelect').value;
            if (!sender || !target) return alert("Selecione remetente e alvo válidos.");
            GiftService.processGift(sender, target, coins, giftName);
        }

        // Inicialização do Jogo
        window.addEventListener('DOMContentLoaded', () => {
            Game.initDemoPlayers(25);
            UI.updateRankingTimerDisplay();
            Game.startRankingTimer();
        });
    </script>
</body>
</html>
