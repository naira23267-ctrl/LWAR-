<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LWAR Arena V1.1</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --frenzy: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .battle-status {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .timer-box {
            background: #090d16;
            border: 2px solid var(--panel-border);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .timer-box.frenzy {
            border-color: var(--frenzy);
            color: var(--frenzy);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        main {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            max-height: calc(100vh - 80px);
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: rgba(0,0,0,0.2);
            padding: 0.75rem 1rem;
            font-weight: bold;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Ranking & Listas */
        .ranking-list, .waiting-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ranking-item {
            background: rgba(255,255,255,0.03);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border-left: 4px solid var(--panel-border);
        }

        .ranking-item.top-tier {
            border-left-color: var(--primary);
        }

        .ranking-item.waiting {
            opacity: 0.6;
            border-left-color: var(--text-muted);
        }

        /* Arena Central */
        .arena-container {
            position: relative;
            background: radial-gradient(circle, #1a233a 0%, #0b1120 100%);
            border: 2px dashed var(--panel-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .arena-grid {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 1.5rem;
            gap: 1rem;
            overflow-y: auto;
        }

        .fighter-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 0.75rem;
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .fighter-card.attacking {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .fighter-card.eliminated {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        .fighter-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .fighter-class {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .hp-bar-container {
            background: #090d16;
            border-radius: 4px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hp-bar-fill {
            background: var(--success);
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        .fighter-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Simulador e Controles */
        .sim-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input, select {
            background: #090d16;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.danger {
            background: var(--accent);
            color: white;
        }

        .gift-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .gift-btn {
            background: #334155;
            color: white;
            font-size: 0.8rem;
            padding: 0.4rem;
        }

        /* Animações de entrada */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fighter-card {
            animation: slideIn 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚔️ LWAR ARENA V1.1</div>
        <div class="battle-status">
            <div>Modo Batalha: <span id="battleStatusText" style="color: var(--success);">Ativo</span></div>
            <div class="timer-box" id="battleTimer">01:00</div>
        </div>
        <div>
            <button id="toggleBattleBtn" class="danger">Pausar Batalha</button>
        </div>
    </header>

    <main>
        <!-- Painel Esquerdo: Ranking Top 20 & Espera -->
        <div class="panel">
            <div class="panel-header">
                <span>🏆 TOP 20 NA ARENA</span>
                <span id="topCount" style="font-size: 0.8rem; color: var(--primary);">0/20</span>
            </div>
            <div class="panel-body">
                <ul class="ranking-list" id="top20List">
                    <!-- Preenchido via JS -->
                </ul>
                <h4 style="margin: 1rem 0 0.5rem 0; font-size: 0.85rem; color: var(--text-muted);">Aguardando na Fila (21+)</h4>
                <ul class="waiting-list" id="waitingList">
                    <!-- Preenchido via JS -->
                </ul>
            </div>
        </div>

        <!-- Painel Central: Arena Visual -->
        <div class="arena-container">
            <div style="position: absolute; top: 10px; left: 15px; font-size: 0.8rem; color: var(--text-muted); z-index: 10;">
                Visualização da Arena (Top 20 Ativos)
            </div>
            <div class="arena-grid" id="arenaGrid">
                <!-- Personagens do Top 20 renderizados aqui -->
            </div>
        </div>

        <!-- Painel Direito: Simulador e Gerenciamento -->
        <div class="panel">
            <div class="panel-header">
                <span>🧪 Simulador de Eventos (TikTok)</span>
            </div>
            <div class="panel-body">
                <div class="sim-controls">
                    <div class="form-group">
                        <label>Adicionar Jogador de Teste</label>
                        <input type="text" id="newUsername" placeholder="@username">
                    </div>
                    <div class="form-group">
                        <label>Classe</label>
                        <select id="newClass">
                            <option value="Guerreiro">Guerreiro</option>
                            <option value="Assassino">Assassino</option>
                            <option value="Mago">Mago</option>
                            <option value="Tanque">Tanque</option>
                            <option value="Ninja">Ninja</option>
                        </select>
                    </div>
                    <button id="addPlayerBtn">Criar / Entrar Jogador</button>

                    <hr style="border-color: var(--panel-border); margin: 0.5rem 0;">

                    <div class="form-group">
                        <label>Simular Presente para Jogador</label>
                        <select id="targetPlayerSelect">
                            <option value="">Selecione o jogador...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Escolher Presente / Moedas</label>
                        <div class="gift-buttons">
                            <button class="gift-btn" onclick="simGift(10)">+10 pts</button>
                            <button class="gift-btn" onclick="simGift(50)">+50 pts</button>
                            <button class="gift-btn" onclick="simGift(100)">+100 pts</button>
                            <button class="gift-btn" onclick="simGift(500)">+500 pts</button>
                            <button class="gift-btn" onclick="simGift(1000)">+1000 pts</button>
                        </div>
                    </div>

                    <hr style="border-color: var(--panel-border); margin: 0.5rem 0;">

                    <div class="form-group">
                        <label>Ações Rápidas</label>
                        <button onclick="Game.initDemoPlayers(25)" style="background: #334155; color: white;">Popular com 25 Jogadores</button>
                        <button onclick="Game.resetBattleTimer()" style="background: #334155; color: white; margin-top: 0.4rem;">Reiniciar Rodada (60s)</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * LWAR ARENA - ARQUITETURA V1.1
         */
        const DEBUG = true;

        const CONFIG = {
            MAX_ARENA_PLAYERS: 20,
            BATTLE_DURATION: 60,
            FRENZY_TRIGGER_TIME: 10,
            FRENZY_DAMAGE_MULT: 2.0,
            FRENZY_SPEED_MULT: 1.5
        };

        // Estado Global Centralizado
        const gameState = {
            players: [],
            arenaPlayers: [],
            waitingPlayers: [],
            battle: {
                active: true,
                timer: 60,
                frenzy: false,
                interval: null
            }
        };

        // ClassManager: Definição de Classes e Atributos Base
        const ClassManager = {
            classes: {
                Guerreiro: { hp: 120, strength: 25, defense: 15, speed: 10 },
                Assassino: { hp: 90,  strength: 35, defense: 8,  speed: 25 },
                Mago:      { hp: 80,  strength: 40, defense: 5,  speed: 15 },
                Tanque:    { hp: 160, strength: 15, defense: 25, speed: 5  },
                Ninja:     { hp: 100, strength: 30, defense: 10, speed: 30 }
            },
            getStats(className) {
                return this.classes[className] || this.classes.Guerreiro;
            }
        };

        // RankManager: Sistema de Progressão por Pontos
        const RankManager = {
            getRank(points) {
                if (points >= 5000) return "Deus";
                if (points >= 3000) return "Anjo";
                if (points >= 1800) return "Demônio";
                if (points >= 1000) return "Mestre";
                if (points >= 500)  return "Avançado";
                return "Iniciante";
            }
        };

        // GiftService: Camada preparada para TikTok LIVE ou Simulação
        const GiftService = {
            mode: "SIMULATION", // ou "REAL" futuramente
            onGiftReceived(callback) {
                this.listener = callback;
            },
            simulate(username, coins) {
                if (DEBUG) console.log(`[Gift] @${username} recebeu ${coins} moedas/pontos.`);
                if (this.listener) {
                    this.listener({ username, coins });
                }
            }
        };

        // PlayerManager & RankingManager
        const RankingManager = {
            addOrUpdatePlayer(username, charClass, pointsDelta) {
                let player = gameState.players.find(p => p.username === username);
                if (!player) {
                    const baseStats = ClassManager.getStats(charClass);
                    player = {
                        id: 'p_' + Math.random().toString(36).substr(2, 9),
                        username: username.startsWith('@') ? username : '@' + username,
                        charClass: charClass,
                        points: 0,
                        hp: baseStats.hp,
                        maxHp: baseStats.hp,
                        strength: baseStats.strength,
                        defense: baseStats.defense,
                        speed: baseStats.speed,
                        status: 'aguardando',
                        lastPointTimestamp: Date.now()
                    };
                    gameState.players.push(player);
                    if (DEBUG) console.log(`[Player] Novo jogador registrado: ${player.username} (${charClass})`);
                }

                if (pointsDelta) {
                    player.points += pointsDelta;
                    player.lastPointTimestamp = Date.now();
                }

                player.rank = RankManager.getRank(player.points);
                this.recalculateRanking();
            },

            recalculateRanking() {
                // Ordenação determinística: Maior pontuação primeiro; desempate por timestamp mais antigo
                gameState.players.sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    return a.lastPointTimestamp - b.lastPointTimestamp;
                });

                // Atualizar posições
                gameState.players.forEach((p, idx) => {
                    p.position = idx + 1;
                });

                // Separar Top 20 e Aguardando
                gameState.arenaPlayers = gameState.players.slice(0, CONFIG.MAX_ARENA_PLAYERS);
                gameState.waitingPlayers = gameState.players.slice(CONFIG.MAX_ARENA_PLAYERS);

                // Atualizar status
                gameState.arenaPlayers.forEach(p => {
                    if (p.status === 'aguardando' || p.status === 'eliminado') {
                        p.status = 'ativo';
                        if (p.hp <= 0) p.hp = p.maxHp; // Revive se entrar no Top 20 com HP zerado
                        if (DEBUG) console.log(`[Ranking] ${p.username} entrou no Top 20 (Posição ${p.position})!`);
                    }
                });

                gameState.waitingPlayers.forEach(p => {
                    if (p.status === 'ativo') {
                        p.status = 'aguardando';
                        if (DEBUG) console.log(`[Ranking] ${p.username} caiu para fora do Top 20 (Posição ${p.position}). Deixou a arena.`);
                    }
                });

                UI.renderAll();
            }
        };

        // BattleManager: Combate Automático, Timer e Frenesi
        const BattleManager = {
            startTimer() {
                if (gameState.battle.interval) clearInterval(gameState.battle.interval);
                
                gameState.battle.interval = setInterval(() => {
                    if (!gameState.battle.active) return;

                    gameState.battle.timer--;
                    
                    // Checar Frenesi (últimos 10 segundos)
                    if (gameState.battle.timer <= CONFIG.FRENZY_TRIGGER_TIME && !gameState.battle.frenzy) {
                        gameState.battle.frenzy = true;
                        if (DEBUG) console.log("[Battle] FRENESI ATIVADO!");
                    }

                    if (gameState.battle.timer <= 0) {
                        this.endRound();
                    }

                    UI.updateTimerDisplay();
                }, 1000);
            },

            tickCombats() {
                if (!gameState.battle.active || gameState.arenaPlayers.length < 2) return;

                // Selecionar dois combatentes aleatórios ativos na arena
                const activeFighters = gameState.arenaPlayers.filter(p => p.hp > 0);
                if (activeFighters.length < 2) return;

                const idx1 = Math.floor(Math.random() * activeFighters.length);
                let idx2 = Math.floor(Math.random() * activeFighters.length);
                while (idx2 === idx1 && activeFighters.length > 1) {
                    idx2 = Math.floor(Math.random() * activeFighters.length);
                }

                const attacker = activeFighters[idx1];
                const defender = activeFighters[idx2];

                // Calcular Dano com multiplicador de Frenesi se aplicável
                const frenzyMult = gameState.battle.frenzy ? CONFIG.FRENZY_DAMAGE_MULT : 1.0;
                const rawDamage = Math.max(5, Math.floor((attacker.strength * 1.2 - defender.defense * 0.5) * frenzyMult));
                
                defender.hp = Math.max(0, defender.hp - rawDamage);

                if (DEBUG) console.log(`[Battle] ${attacker.username} atacou ${defender.username} causando ${rawDamage} de dano. HP restante: ${defender.hp}`);

                UI.flashFighter(attacker.id);

                if (defender.hp === 0) {
                    defender.status = 'eliminado';
                    if (DEBUG) console.log(`[Battle] ${defender.username} foi eliminado!`);
                }

                UI.renderArena();
            },

            endRound() {
                if (DEBUG) console.log("[Battle] Rodada finalizada pelo timer!");
                // Determinar vencedor por HP ou pontos
                const fighters = gameState.arenaPlayers.filter(p => p.status === 'ativo');
                if (fighters.length > 0) {
                    fighters.sort((a, b) => b.hp - a.hp || b.points - a.points);
                    if (DEBUG) console.log(`[Battle] Vencedor da rodada: ${fighters[0].username} com ${fighters[0].hp} HP!`);
                }
                this.resetRound();
            },

            resetRound() {
                gameState.battle.timer = CONFIG.BATTLE_DURATION;
                gameState.battle.frenzy = false;
                gameState.arenaPlayers.forEach(p => {
                    p.hp = p.maxHp;
                    p.status = 'ativo';
                });
                UI.renderAll();
            }
        };

        // UI Manager: Renderização e Manipulação do DOM
        const UI = {
            renderAll() {
                this.renderRanking();
                this.renderArena();
                this.populateTargetSelect();
            },

            renderRanking() {
                const topList = document.getElementById('top20List');
                const waitingList = document.getElementById('waitingList');
                const topCount = document.getElementById('topCount');

                topList.innerHTML = '';
                waitingList.innerHTML = '';
                topCount.innerText = `${gameState.arenaPlayers.length}/20`;

                gameState.arenaPlayers.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'ranking-item top-tier';
                    li.innerHTML = `<span>#${p.position} ${p.username} <small>(${p.rank})</small></span> <strong>${p.points} pts</strong>`;
                    topList.appendChild(li);
                });

                gameState.waitingPlayers.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'ranking-item waiting';
                    li.innerHTML = `<span>#${p.position} ${p.username} <small>(${p.rank})</small></span> <strong>${p.points} pts</strong>`;
                    waitingList.appendChild(li);
                });
            },

            renderArena() {
                const grid = document.getElementById('arenaGrid');
                grid.innerHTML = '';

                gameState.arenaPlayers.forEach(p => {
                    const card = document.createElement('div');
                    card.className = `fighter-card ${p.hp <= 0 ? 'eliminated' : ''}`;
                    card.id = `fighter_${p.id}`;

                    const hpPercent = Math.max(0, (p.hp / p.maxHp) * 100);

                    card.innerHTML = `
                        <div class="fighter-header">
                            <span>#${p.position} ${p.username}</span>
                            <span style="color: var(--primary);">${p.points}p</span>
                        </div>
                        <div class="fighter-class">${p.charClass} • ${p.rank}</div>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill" style="width: ${hpPercent}%;"></div>
                        </div>
                        <div class="fighter-stats">
                            <span>HP: ${p.hp}/${p.maxHp}</span>
                            <span>ATK: ${p.strength}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            },

            populateTargetSelect() {
                const select = document.getElementById('targetPlayerSelect');
                const currentVal = select.value;
                select.innerHTML = '<option value="">Selecione o jogador...</option>';
                
                gameState.players.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.username;
                    opt.innerText = `${p.username} (${p.points} pts)`;
                    select.appendChild(opt);
                });
                select.value = currentVal;
            },

            updateTimerDisplay() {
                const timerBox = document.getElementById('battleTimer');
                const minutes = String(Math.floor(gameState.battle.timer / 60)).padStart(2, '0');
                const seconds = String(gameState.battle.timer % 60).padStart(2, '0');
                timerBox.innerText = `${minutes}:${seconds}`;

                if (gameState.battle.frenzy) {
                    timerBox.classList.add('frenzy');
                } else {
                    timerBox.classList.remove('frenzy');
                }
            },

            flashFighter(id) {
                const card = document.getElementById(`fighter_${id}`);
                if (card) {
                    card.classList.add('attacking');
                    setTimeout(() => card.classList.remove('attacking'), 300);
                }
            }
        };

        // Funções Globais e Inicialização
        const Game = {
            initDemoPlayers(count = 25) {
                const classes = Object.keys(ClassManager.classes);
                const sampleNames = ["GamerBR", "Shadow", "Loxia", "Titan", "ZeldaFan", "NarutoX", "Kratos", "Valkyrie", "Phoenix", "Blaze", "Storm", "Frost", "Cyber", "NinjaBro", "MageKing", "Apex", "Vortex", "Matrix", "Ghost", "Specter", "Ronin", "Samurai", "Paladin", "Druid", "Bard"];
                
                for (let i = 0; i < count; i++) {
                    const name = sampleNames[i % sampleNames.length] + (i >= sampleNames.length ? i : '');
                    const cClass = classes[Math.floor(Math.random() * classes.length)];
                    const initialPoints = Math.floor(Math.random() * 800) + 50;
                    RankingManager.addOrUpdatePlayer(name, cClass, initialPoints);
                }
            },

            resetBattleTimer() {
                gameState.battle.timer = CONFIG.BATTLE_DURATION;
                gameState.battle.frenzy = false;
                UI.updateTimerDisplay();
                if (DEBUG) console.log("[Battle] Timer reiniciado manualmente.");
            }
        };

        // Configuração de Event Listeners
        document.getElementById('addPlayerBtn').addEventListener('click', () => {
            const input = document.getElementById('newUsername');
            const classSelect = document.getElementById('newClass');
            const username = input.value.trim();
            if (!username) return alert("Digite um nome de usuário válido!");

            RankingManager.addOrUpdatePlayer(username, classSelect.value, 100);
            input.value = '';
        });

        document.getElementById('toggleBattleBtn').addEventListener('click', (e) => {
            gameState.battle.active = !gameState.battle.active;
            const statusText = document.getElementById('battleStatusText');
            if (gameState.battle.active) {
                e.target.innerText = "Pausar Batalha";
                e.target.className = "danger";
                statusText.innerText = "Ativo";
                statusText.style.color = "var(--success)";
            } else {
                e.target.innerText = "Retomar Batalha";
                e.target.className = "";
                statusText.innerText = "Pausado";
                statusText.style.color = "var(--accent)";
            }
        });

        function simGift(coins) {
            const select = document.getElementById('targetPlayerSelect');
            const username = select.value;
            if (!username) {
                alert("Selecione um jogador para enviar o presente!");
                return;
            }
            GiftService.simulate(username, coins);
        }

        // Conectar GiftService ao RankingManager
        GiftService.onGiftReceived(event => {
            // Encontra a classe atual do jogador ou usa Guerreiro como padrão
            const existing = gameState.players.find(p => p.username === event.username);
            const charClass = existing ? existing.charClass : "Guerreiro";
            RankingManager.addOrUpdatePlayer(event.username, charClass, event.coins);
        });

        // Inicialização de Teste e Loops de Batalha
        window.addEventListener('DOMContentLoaded', () => {
            Game.initDemoPlayers(22); // Cria 22 jogadores para testar Top 20 vs Fila de Espera
            BattleManager.startTimer();

            // Loop de combate automático a cada 2.5 segundos
            setInterval(() => {
                BattleManager.tickCombats();
            }, 2500);
        });
    </script>
</body>
</html>
